---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  namespace: honcho
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: oauth2-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oauth2-proxy
    spec:
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.8.1
          # Human-only front door: it exists so a browser can reach /docs and
          # inspect memory. Hermes does NOT go through here — the SDK talks to
          # the honcho Service directly and authenticates with a scoped JWT.
          # An OIDC redirect would be uncompletable by a non-interactive client.
          args:
            - --provider=oidc
            - --oidc-issuer-url=https://id.kalitsune.net
            - --redirect-url=https://honcho.lab.kalitsune.net/oauth2/callback
            # Single upstream: the OpenConcho UI. Honcho's own HTTP surface is
            # deliberately NOT mapped here.
            #
            # The SPA issues every Honcho call same-origin to /api/ and names
            # the real backend in an X-Honcho-Upstream header, which nginx
            # forwards server-side (see packages/web/src/lib/dispatch.ts). So
            # /api/ already reaches the API through the UI pod — and it is
            # constrained by that pod's upstream allowlist. Mapping /v3/ and
            # /docs here as well would add a second, unconstrained route to
            # the same API for no gain.
            #
            # Direct API access is still available two ways: through /api/
            # with the upstream header, or a port-forward to svc/honcho.
            - --upstream=http://openconcho:80
            - --http-address=0.0.0.0:4180
            - --email-domain=*
            - --cookie-secure=true
            - --cookie-name=_oauth2_proxy_honcho
            - --session-store-type=cookie
            - --banner="-"
            - --skip-provider-button=true
            - --code-challenge-method=S256
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secret
                  key: clientId
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secret
                  key: clientSecret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secret
                  key: cookieSecret
          ports:
            - name: http
              containerPort: 4180
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy
  namespace: honcho
spec:
  selector:
    app.kubernetes.io/name: oauth2-proxy
  ports:
    - port: 4180
      targetPort: http
