---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  namespace: honcho
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: oauth2-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oauth2-proxy
    spec:
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.8.1
          # Human-only front door: it exists so a browser can reach /docs and
          # inspect memory. Hermes does NOT go through here — the SDK talks to
          # the honcho Service directly and authenticates with a scoped JWT.
          # An OIDC redirect would be uncompletable by a non-interactive client.
          args:
            - --provider=oidc
            - --oidc-issuer-url=https://id.kalitsune.net
            - --redirect-url=https://honcho.lab.kalitsune.net/oauth2/callback
            # Multiple upstreams, routed by path with longest-match winning.
            # Default: the OpenConcho UI, so / is a usable dashboard instead
            # of Honcho's bare {"detail":"Not Found"}.
            - --upstream=http://openconcho:80
            # Honcho's own surfaces stay reachable on the same hostname:
            # /docs and /redoc for the API explorer, /v3/ for direct API
            # calls, /health for probing. Without these the raw API would
            # become unreachable the moment the UI took over /.
            - --upstream=http://honcho:8000/docs
            - --upstream=http://honcho:8000/redoc
            - --upstream=http://honcho:8000/openapi.json
            - --upstream=http://honcho:8000/health
            - --upstream=http://honcho:8000/v3/
            - --http-address=0.0.0.0:4180
            - --email-domain=*
            - --cookie-secure=true
            - --cookie-name=_oauth2_proxy_honcho
            - --session-store-type=cookie
            - --banner="-"
            - --skip-provider-button=true
            - --code-challenge-method=S256
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secret
                  key: clientId
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secret
                  key: clientSecret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secret
                  key: cookieSecret
          ports:
            - name: http
              containerPort: 4180
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy
  namespace: honcho
spec:
  selector:
    app.kubernetes.io/name: oauth2-proxy
  ports:
    - port: 4180
      targetPort: http
