apiVersion: v1
kind: Service
metadata:
  name: honcho
  namespace: honcho
spec:
  selector:
    app.kubernetes.io/name: honcho-api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: honcho-api
  namespace: honcho
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: honcho-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: honcho-api
      annotations:
        # A ConfigMap edit does NOT restart pods on its own: envFrom is read
        # once at container start, so model/transport changes would sit in the
        # ConfigMap unread while the old process kept using the old provider.
        # Bump this whenever honcho-config changes to force a rollout.
        #   1: 9Router (fast-af) replaces the direct Gemini transport
        kalitsune.net/config-generation: "1"
    spec:
      # No pod-level runAsUser: the two containers run as DIFFERENT uids
      # (honcho 100, nginx-unprivileged 101) and forcing either one onto the
      # other breaks file ownership inside its image. Security context is set
      # per-container below.
      #
      # fsGroup 101 makes the emptyDir mounts writable by nginx. The api
      # container already runs with gid 101 and mounts no volumes, so this is
      # a no-op for it.
      securityContext:
        fsGroup: 101
      containers:
        - name: api
          image: ghcr.io/plastic-labs/honcho:v3.1.0
          # The image's default CMD starts the API without running migrations.
          # docker/entrypoint.sh runs provision_db.py (CREATE EXTENSION vector
          # + alembic upgrade head) first, which is what a fresh database
          # needs. The deriver deliberately does NOT run this — two processes
          # running alembic concurrently race on the migration table.
          command:
            - sh
            - /app/docker/entrypoint.sh
          envFrom:
            - configMapRef:
                name: honcho-config
            - secretRef:
                name: honcho-secrets
            # Minted by the 9router provisioning Job, not by Flux — it holds
            # LLM_OPENAI_API_KEY for the 9Router backend. optional: true so a
            # fresh cluster can bring Honcho up before that Job has run;
            # without it the pod sits in CreateContainerConfigError and the
            # two apps deadlock on each other's readiness.
            - secretRef:
                name: 9router-honcho-key
                optional: true
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            httpGet:
              path: /health
              port: http
            # Migrations run before the server binds. Allow up to 5 minutes on
            # a first deploy so a slow alembic run is not killed mid-migration.
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi

        # OpenConcho web UI, colocated as a sidecar rather than run as its own
        # Deployment. Sharing this pod's network namespace lets the browser
        # name the backend as http://127.0.0.1:8000.
        #
        # That matters because the UI refuses to store an API token unless the
        # base URL is HTTPS *or* a loopback host
        # (packages/web/src/lib/security.ts, isSecureTokenTransport). A Service
        # DNS name over plain HTTP is rejected client-side, so a same-pod
        # loopback address is what makes the token field usable without
        # publishing the API over TLS on its own hostname.
        #
        # The check runs in the BROWSER against the URL string; the request is
        # made by this nginx inside the pod, where 127.0.0.1:8000 really is the
        # api container. The two agree only because they are colocated.
        - name: openconcho
          image: ghcr.io/offendingcommit/openconcho-web:0.16.2
          securityContext:
            runAsUser: 101
            runAsGroup: 101
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: OPENCONCHO_DEFAULT_HONCHO_URL
              value: "http://127.0.0.1:8000"
            # SSRF guard, now narrowed to loopback. Without it this /api/
            # proxy forwards anywhere a request names — an open relay onto the
            # cluster network. Upstream defaults it to open because upstream
            # assumes a localhost-only bind.
            - name: OPENCONCHO_UPSTREAM_ALLOWLIST
              value: "127.0.0.1"
          ports:
            - name: ui
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: ui
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: ui
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            # nginx needs these writable; its root filesystem is read-only.
            # /tmp also holds the entrypoint-rendered config.js.
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: nginx-tmp
              mountPath: /tmp
      volumes:
        - name: nginx-conf
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: nginx-tmp
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: honcho-deriver
  namespace: honcho
spec:
  # Background worker that turns messages into observations and peer
  # representations. Without it messages are stored but no memory is ever
  # built. Workers coordinate through the Postgres queue, so this can be
  # scaled out later if the backlog grows.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: honcho-deriver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: honcho-deriver
      annotations:
        # Must be bumped together with the api Deployment above — see the
        # comment there. Leaving the deriver un-rolled is the worse half of
        # the bug: it is the process that actually spends the LLM quota.
        kalitsune.net/config-generation: "1"
    spec:
      containers:
        - name: deriver
          image: ghcr.io/plastic-labs/honcho:v3.1.0
          command:
            - python
            - -m
            - src.deriver
          envFrom:
            - configMapRef:
                name: honcho-config
            - secretRef:
                name: honcho-secrets
            # See the api container: same Job-minted 9Router key. The deriver
            # is the heaviest LLM caller of the two, so this is the container
            # the quota fix is really for.
            - secretRef:
                name: 9router-honcho-key
                optional: true
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
