apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: honcho
  namespace: honcho
spec:
  parentRefs:
    - name: apps
      namespace: envoy-gateway-system
  hostnames:
    # Internal-only. This surface exposes every peer representation and
    # conclusion Honcho holds, and /docs issues live authenticated API calls,
    # so it must never move to the apex domain.
    - honcho.lab.kalitsune.net
  rules:
    # Everything goes through oauth2-proxy, never straight to port 8000.
    - backendRefs:
        - name: oauth2-proxy
          port: 4180
