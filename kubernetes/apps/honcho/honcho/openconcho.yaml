apiVersion: v1
kind: Service
metadata:
  name: openconcho
  namespace: honcho
spec:
  # The UI is a sidecar in the honcho-api pod, so this selects that pod and
  # targets its `ui` port. Colocation is what lets the browser use
  # http://127.0.0.1:8000 as the backend URL — see the comment on the
  # openconcho container in deployment.yaml.
  selector:
    app.kubernetes.io/name: honcho-api
  ports:
    - name: http
      port: 80
      targetPort: ui
