apiVersion: v1
kind: ConfigMap
metadata:
  name: netbird-config
  namespace: netbird
data:
  config.yaml: |
    server:
      listenAddress: ":443"
      exposedAddress: "https://netbird.lab.kalitsune.net:443"
      metricsPort: 9090
      healthcheckAddress: ":9000"
      logLevel: "info"
      logFile: "console"
      tls:
        letsencrypt:
          enabled: false
      authSecret: "${NETBIRD_AUTH_SECRET}"
      dataDir: "/var/lib/netbird/"
      auth:
        issuer: "https://netbird.lab.kalitsune.net/oauth2"
        localAuthDisabled: true
        signKeyRefreshEnabled: false
        dashboardRedirectURIs:
          - "https://netbird.lab.kalitsune.net/nb-auth"
          - "https://netbird.lab.kalitsune.net/nb-silent-auth"
          - "https://netbird.lab.kalitsune.net/api/reverse-proxy/callback"
        cliRedirectURIs:
          - "http://localhost:53000/"
          - "https://netbird.lab.kalitsune.net/oauth2/device/callback"
        staticConnectors:
          - type: oidc
            id: pocketid
            name: Pocket ID
            config:
              issuer: "https://id.kalitsune.net/api/oidc"
              clientID: "4ad1481d-f379-4594-a46f-ce0c37f424b5"
              clientSecret: "${OIDC_CLIENT_SECRET}"
              redirectURI: "https://netbird.lab.kalitsune.net/oauth2/callback"
      store:
        engine: "sqlite"
        encryptionKey: "${NETBIRD_ENCRYPTION_KEY}"
      stuns:
        - uri: "stun:netbird.lab.kalitsune.net:3478"
      turn: []
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: netbird-data
  namespace: netbird
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: netbird-server
  namespace: netbird
  annotations:
    projectcontour.io/upstream-protocol.h2c: "443"
    projectcontour.io/websocket: "443"
spec:
  selector:
    app: netbird-server
  ports:
    - name: https
      port: 443
      targetPort: 443
      appProtocol: h2c
    - name: stun
      port: 3478
      targetPort: 3478
      protocol: UDP
---
apiVersion: v1
kind: Service
metadata:
  name: netbird-stun
  namespace: netbird
  annotations:
    io.cilium/lb-ipam-ips: "192.168.100.3"
spec:
  type: LoadBalancer
  selector:
    app: netbird-server
  ports:
    - name: stun
      port: 3478
      targetPort: 3478
      protocol: UDP
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netbird-server
  namespace: netbird
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: netbird-server
  template:
    metadata:
      labels:
        app: netbird-server
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: render-config
          image: docker.io/alpine:3.20
          command: ["/bin/sh", "-c"]
          args:
            - |
              apk add --no-cache gettext
              envsubst < /etc/netbird/config-tpl/config.yaml > /var/lib/netbird/config.yaml
          envFrom:
            - secretRef:
                name: netbird-secret
          volumeMounts:
            - name: config-tpl
              mountPath: /etc/netbird/config-tpl
            - name: data
              mountPath: /var/lib/netbird
      containers:
        - name: server
          image: docker.io/netbirdio/netbird-server:0.80.0
          command: ["/go/bin/netbird-server"]
          args: ["--config", "/var/lib/netbird/config.yaml"]
          ports:
            - containerPort: 443
              name: grpc-http
            - containerPort: 9000
              name: health
            - containerPort: 9090
              name: metrics
            - containerPort: 3478
              protocol: UDP
              name: stun
          volumeMounts:
            - name: data
              mountPath: /var/lib/netbird
          livenessProbe:
            httpGet:
              path: /health
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: netbird-data
        - name: config-tpl
          configMap:
            name: netbird-config
