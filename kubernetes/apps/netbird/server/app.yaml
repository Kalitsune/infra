apiVersion: apps/v1
kind: Deployment
metadata:
  name: netbird
  namespace: netbird
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: netbird
  template:
    metadata:
      labels:
        app: netbird
      annotations:
        # envFrom/secret mounts are read once at container start; bump this to
        # force a roll when the config Secret or dashboard ConfigMap changes.
        kalitsune.net/config-generation: "2"
    spec:
      containers:
        - name: netbird-server
          image: docker.io/netbirdio/netbird-server:0.80.0
          command:
            - "/go/bin/netbird-server"
            - "--config"
            - "/etc/netbird/config.yaml"
          ports:
            # :8080, not :80 -- the dashboard nginx in this same pod owns :80,
            # and a shared network namespace means one bind per port.
            - containerPort: 8080
              name: http-grpc
            - containerPort: 9000
              name: health
          volumeMounts:
            - name: netbird-data
              mountPath: /var/lib/netbird
            - name: config
              mountPath: /etc/netbird
              readOnly: true
          livenessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
        - name: netbird-dashboard
          image: docker.io/netbirdio/dashboard:latest
          envFrom:
            - configMapRef:
                name: netbird-dashboard-config
          ports:
            - containerPort: 80
              name: dashboard-http
      volumes:
        - name: netbird-data
          persistentVolumeClaim:
            claimName: netbird-data
        - name: config
          secret:
            secretName: netbird-config-secret
