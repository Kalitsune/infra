apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: netbird
  namespace: netbird
spec:
  parentRefs:
    - name: apps
      namespace: envoy-gateway-system
  hostnames:
    - "netbird.lab.kalitsune.net"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /signalexchange.SignalExchange/
        - path:
            type: PathPrefix
            value: /management.ManagementService/
        - path:
            type: PathPrefix
            value: /management.ProxyService/
      backendRefs:
        - name: netbird-server
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /relay
        - path:
            type: PathPrefix
            value: /ws-proxy/
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: netbird-server
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: netbird-dashboard
          port: 80
