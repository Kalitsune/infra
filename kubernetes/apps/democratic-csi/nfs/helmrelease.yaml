apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: democratic-csi-nfs
  namespace: democratic-csi
spec:
  interval: 30m
  chart:
    spec:
      chart: democratic-csi
      version: ">=0.15.0 <1.0.0"
      sourceRef:
        kind: HelmRepository
        name: democratic-csi
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  valuesFrom:
    - kind: Secret
      name: democratic-csi-nfs-apikey
      valuesKey: apiKey
      targetPath: driver.config.httpConnection.apiKey

  values:
    csiDriver:
      name: org.democratic-csi.nfs

    driver:
      config:
        driver: freenas-api-nfs
        httpConnection:
          protocol: https
          host: 192.168.1.162
          port: 443
          allowInsecure: true
        zfs:
          datasetParentName: mass/k8s/nfs/vols
          detachedSnapshotsDatasetParentName: mass/k8s/nfs/snaps
          datasetPermissionsMode: "0777"
          datasetPermissionsUser: 0
          datasetPermissionsGroup: 0
        nfs:
          shareHost: 192.168.1.162

    storageClasses:
      - name: truenas-nfs
        defaultClass: false
        reclaimPolicy: Delete
        volumeBindingMode: Immediate
        allowVolumeExpansion: true
        parameters:
          fsType: nfs
        mountOptions:
          - noatime
          - nfsvers=4

