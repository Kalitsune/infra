apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pocket-id
  namespace: pocket-id
spec:
  interval: 30m
  chart:
    spec:
      chart: pocket-id
      version: ">=2.0.0 <3.0.0"
      sourceRef:
        kind: HelmRepository
        name: anza-labs
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  valuesFrom:
    - kind: Secret
      name: pocket-id-secrets
      valuesKey: encryptionKey
      targetPath: encryptionKey
  values:
    host: id.kalitsune.net
    updateStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: "100%"
    persistence:
      data:
        enabled: true
        storageClass: truenas-nfs
        accessMode: ReadWriteOnce
        size: 10Gi
