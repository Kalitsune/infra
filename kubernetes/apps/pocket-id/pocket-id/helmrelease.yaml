apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pocket-id
  namespace: pocket-id
spec:
  interval: 30m
  chart:
    spec:
      chart: pocket-id
      version: ">=2.0.0 <3.0.0"
      sourceRef:
        kind: HelmRepository
        name: anza-labs
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  valuesFrom:
    - kind: Secret
      name: pocket-id-secrets
      valuesKey: encryptionKey
      targetPath: encryptionKey
    - kind: Secret
      name: pocket-id-secrets
      valuesKey: smtpPassword
      targetPath: config.ui.settings.smtp.password
  values:
    host: id.kalitsune.net
    updateStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: "100%"
    persistence:
      data:
        enabled: true
        storageClass: local-path
        accessMode: ReadWriteOnce
        size: 10Gi
    config:
      ui:
        useDefaults: true
        settings:
          app:
            appName: "FoxID!"
            homePageUrl: "/settings/apps"
            allowUserSignups: "withToken"
          email:
            oneTimeAccessAsAdminEnabled: true
            apiKeyExpirationEnabled: true
            verificationEnabled: true
          smtp:
            from: "auth@kalitsune.net"
            host: "smtp.resend.com"
            user: "resend"
            port: "465"
            tls: "tls"
    startupProbe:
      httpGet:
        path: /healthz
        port: http
      failureThreshold: 10
      periodSeconds: 5
      timeoutSeconds: 5
    livenessProbe:
      httpGet:
        path: /healthz
        port: http
      failureThreshold: 5
      periodSeconds: 10
    readinessProbe:
      httpGet:
        path: /healthz
        port: http
      failureThreshold: 5
      periodSeconds: 10
    pocketID:
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 256Mi
