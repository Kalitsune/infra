apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agents-dashboard-rendercheck
  namespace: hermes
spec:
  parentRefs:
    - name: apps
      namespace: envoy-gateway-system
  hostnames:
    - dash-rendercheck.lab.kalitsune.net
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: agents-dashboard
