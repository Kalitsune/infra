apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - helmrepository.yaml
  - ../secret.yaml
  - matrix-secret-default.yaml
  - matrix-recovery-secret.yaml
  - a2a-secret.yaml
  - honcho-client-secret.yaml
