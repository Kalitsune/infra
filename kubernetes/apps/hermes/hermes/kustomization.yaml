apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - helmrepository.yaml
  - secret.yaml
  - helmrelease.yaml
  - oauth2-secret.yaml
  - httproute.yaml
  - rbac.yaml
  - hermes-auth-redirect.yaml

configMapGenerator:
  - name: infra-expert-profile
    namespace: hermes
    options:
      disableNameSuffixHash: true
    files:
      - SOUL.md=profiles/infra-expert/SOUL.md
      - config.yaml=profiles/infra-expert/config.yaml
