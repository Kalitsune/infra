apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes
  namespace: hermes
spec:
  interval: 30m
  chart:
    spec:
      chart: hermes-agent
      version: ">=1.11.0 <2.0.0"
      sourceRef:
        kind: HelmRepository
        name: hermes-agent
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3

  # Pin the two chart-version labels the chart stamps onto the PVC template.
  #
  # A StatefulSet's volumeClaimTemplates is IMMUTABLE, but the chart writes
  # `helm.sh/chart: hermes-agent-<version>` and
  # `app.kubernetes.io/version: <appVersion>` into
  # volumeClaimTemplates[0].metadata.labels. Both change on every chart
  # release, so the API server rejected the entire StatefulSet update:
  #
  #   StatefulSet.apps "hermes-hermes-agent" is invalid: spec: Forbidden:
  #   updates to statefulset spec for fields other than 'replicas', ...
  #
  # Since `version` above is a RANGE, this broke every automatic bump: Flux
  # retried, rolled back, and parked at Ready=False/RetriesExceeded while
  # still running the old chart — no values change could reach the cluster.
  # `upgrade.force` does not help; it is a replace-style patch and still
  # cannot mutate an immutable field.
  #
  # These values are deliberately FROZEN to what is on the live object, not
  # to the current chart version. They must match, or the upgrade is refused:
  #   kubectl -n hermes get sts hermes-hermes-agent \
  #     -o jsonpath='{.spec.volumeClaimTemplates[0].metadata.labels}'
  #
  # Only PVC-template metadata is affected, which is decorative — the pod
  # template, image and appVersion labels elsewhere still track the chart.
  postRenderers:
    - kustomize:
        patches:
          - target:
              version: v1
              kind: StatefulSet
              name: hermes-hermes-agent
            patch: |
              - op: replace
                path: /spec/volumeClaimTemplates/0/metadata/labels/helm.sh~1chart
                value: hermes-agent-1.12.1
              - op: replace
                path: /spec/volumeClaimTemplates/0/metadata/labels/app.kubernetes.io~1version
                value: v2026.8.27
  values:
    config:
      model:
        provider: anthropic
        default: claude-sonnet-5
      # Multiplexing is GONE. It previously hosted the infra-expert agent as a
      # second profile inside this process; that agent now runs as its own
      # release (../homelab-expert) with its own pod, PVC and credentials.
      #
      # Do not re-enable it to add another agent. Two profiles in one process
      # on one volume share a uid, and the NFS export squashes every uid to a
      # single owner -- so file modes cannot separate them and any profile
      # with the `terminal` toolset can read the others' credentials. Give a
      # new agent its own release instead.

    extraVolumes:
      - name: honcho-client-secrets
        secret:
          secretName: honcho-client-secrets
      # Managed scope: an IT-pinned config layer Hermes merges over every
      # profile's config.yaml, including profiles created at runtime. Used to
      # turn on the Honcho memory provider globally.
      - name: hermes-managed
        configMap:
          name: hermes-managed

    extraInitContainers:
      # The Honcho memory plugin ships in the image, but its SDK does not.
      # Without it the plugin logs "honcho-ai package not installed -- plugin
      # inactive" at debug level and silently does nothing: memory looks
      # configured but never records or recalls.
      #
      # Hermes seals its own venv (HERMES_DISABLE_LAZY_INSTALLS=1) and
      # redirects runtime installs to HERMES_LAZY_INSTALL_TARGET on the data
      # volume, which hermes_bootstrap appends to sys.path at startup. Install
      # into that same directory so the import resolves on boot.
      #
      # --no-deps is deliberate: honcho-ai needs only httpx>=0.28 and
      # pydantic>=2, both already in the core venv at compatible versions.
      # Pulling its own copies into an append-only path risks two versions of
      # pydantic in one interpreter.
      - name: install-honcho-sdk
        image: nousresearch/hermes-agent:v2026.8.31
        command:
          - sh
          - -c
          - |
            set -eu
            target=/opt/data/lazy-packages
            mkdir -p "$target"
            if [ -d "$target/honcho" ]; then
              echo "honcho-ai already present, skipping"
              exit 0
            fi
            uv pip install --target "$target" --no-deps 'honcho-ai==2.2.0'
            echo "installed honcho-ai into $target"
        volumeMounts:
          - name: data
            mountPath: /opt/data

      - name: seed-agent-home
        image: busybox:1.38
        command:
          - sh
          - -c
          - |
            set -eu

            # Honcho memory config. This profile is the only one in this pod,
            # so the file goes at the Hermes root. peerName is shared with the
            # homelab-expert release so both agents see one view of the user,
            # while each keeps its own AI peer and therefore its own
            # self-model.
            #
            # apiKey lives at the top level: the plugin only substitutes its
            # "local" placeholder for loopback/RFC1918 URLs, and a cluster DNS
            # name is neither, so the real JWT is required here.
            api_key="$(cat /honcho-client-secrets/HONCHO_API_KEY)"
            cat > /opt/data/honcho.json <<EOF
            {
              "enabled": true,
              "baseUrl": "http://honcho.honcho.svc.cluster.local:8000",
              "apiKey": "$api_key",
              "workspace": "hermes",
              "peerName": "kalitsune",
              "recallMode": "hybrid",
              "writeFrequency": "async",
              "sessionStrategy": "global",
              "saveMessages": true
            }
            EOF
            chmod 600 /opt/data/honcho.json
            echo "seeded honcho.json"

            # Matrix crypto-store reset on device rotation.
            #
            # crypto.db binds the olm identity to ONE device_id. Rotating
            # MATRIX_ACCESS_TOKEN issues a NEW device_id while the store still
            # holds the OLD identity, so the adapter runs as a device whose
            # keys peers cannot use: no Olm session is established and every
            # encrypted message fails with "Failed to decrypt megolm event: no
            # session with given ID" while the pod looks healthy and Flux
            # reports Ready.
            #
            # Detection reads the store itself rather than a marker file:
            # SQLite stores TEXT inline, so the live device_id appears
            # verbatim in crypto.db. A store that already matches is left
            # alone, which makes this a no-op on first run and for
            # never-rotated deployments.
            #
            # Cost of a reset: previously-received room keys are lost, so
            # messages sent BEFORE the rotation stay unreadable. New traffic
            # works, because the fresh device negotiates new Olm sessions.
            store=/opt/data/platforms/matrix/store
            want="${MATRIX_DEVICE_ID:-}"
            if [ -n "$want" ] && [ -f "$store/crypto.db" ]; then
              if grep -qa "$want" "$store/crypto.db"; then
                echo "matrix crypto store current (device $want)"
              else
                rm -rf "$store"
                echo "matrix crypto store RESET (configured device $want absent)"
              fi
            fi
        env:
          # Read by the crypto-store check above. Safe in the process env:
          # this pod hosts a single profile, so there is no second profile to
          # leak it to and no scoped-lookup subtlety.
          - name: MATRIX_DEVICE_ID
            valueFrom:
              secretKeyRef:
                name: hermes-matrix-secrets-default
                key: MATRIX_DEVICE_ID
        volumeMounts:
          - name: data
            mountPath: /opt/data
          - name: honcho-client-secrets
            mountPath: /honcho-client-secrets
            readOnly: true

    extraVolumeMounts:
      # Managed scope directory. Hermes merges this config.yaml over every
      # profile's own, so `memory.provider: honcho` applies globally instead
      # of being copy-pasted into each profile's config.yaml.
      - name: hermes-managed
        mountPath: /etc/hermes
        readOnly: true

    extraEnv:
      - name: HERMES_DASHBOARD
        value: "1"
      - name: HERMES_DASHBOARD_HOST
        value: "127.0.0.1"
      - name: HERMES_DASHBOARD_PUBLIC_URL
        value: "https://hermes.kalitsune.net"
      - name: HERMES_DASHBOARD_OIDC_ISSUER
        value: "https://id.kalitsune.net"
      - name: HERMES_DASHBOARD_OIDC_CLIENT_ID
        valueFrom:
          secretKeyRef:
            name: oauth2-proxy-secret
            key: clientId
      - name: HERMES_DASHBOARD_OIDC_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: oauth2-proxy-secret
            key: clientSecret
      - name: HASS_URL
        value: "http://192.168.1.164"

      # Threading policy for GROUP rooms. Read with a bare os.getenv()
      # (adapter.py _auto_thread / _matrix_session_scope), so the process env
      # is the correct home.
      #
      # Default behaviour was: every group message the bot answers becomes a
      # NEW synthetic Matrix thread rooted at that message, so a room fills
      # with one-reply threads and each gets its own session.
      #
      # auto_thread=false stops creating them; session_scope=room is the
      # documented companion that keeps unthreaded room messages in ONE
      # stable room session instead of a per-event lane. Real Matrix threads
      # a human starts are still honoured — that branch reads m.relates_to
      # before this policy applies.
      #
      # Consequence to know: the bot no longer has "already participated in
      # this thread" as a wake condition in groups, and MATRIX_REQUIRE_MENTION
      # is true, so every group message now needs an @mention. DMs are
      # unaffected (dm_auto_thread already defaults false).
      - name: MATRIX_AUTO_THREAD
        value: "false"
      - name: MATRIX_SESSION_SCOPE
        value: "room"

    extraContainers:
      - name: oauth2-proxy
        image: quay.io/oauth2-proxy/oauth2-proxy:v7.8.1
        args:
          - --provider=oidc
          - --oidc-issuer-url=https://id.kalitsune.net
          - --redirect-url=https://hermes.kalitsune.net/oauth2/callback
          - --upstream=http://127.0.0.1:9119
          - --http-address=0.0.0.0:4180
          - --email-domain=*
          - --cookie-secure=true
          - --cookie-name=_oauth2_proxy_hermes
          - --session-store-type=cookie
          - --banner="-"
          - --skip-provider-button=true
          - --code-challenge-method=S256
        env:
          - name: OAUTH2_PROXY_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: oauth2-proxy-secret
                key: clientId
          - name: OAUTH2_PROXY_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: oauth2-proxy-secret
                key: clientSecret
          - name: OAUTH2_PROXY_COOKIE_SECRET
            valueFrom:
              secretKeyRef:
                name: oauth2-proxy-secret
                key: cookieSecret
        ports:
          - name: http
            containerPort: 4180
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
        readinessProbe:
          httpGet:
            path: /ping
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext: {}
    # Bump whenever a value consumed through `envFrom` changes — most often
    # a rotated MATRIX_ACCESS_TOKEN in matrix-secret.yaml.
    #
    # A Secret read via envFrom is injected ONCE, at container start. Editing
    # it does NOT roll a StatefulSet: the pod template is unchanged, so
    # Kubernetes does nothing, Flux reports the Kustomization Ready, and the
    # running process keeps the OLD value. The symptom is a service that
    # looks deployed and healthy while failing every request.
    #
    # This bit us exactly once: rotating the Matrix account left the gateway
    # looping on `Matrix: sync error: Invalid token` against a correct Secret
    # it had never re-read. This annotation IS part of the pod template, so
    # bumping it in the same commit as the secret change is what applies it.
    #
    # generation 2: Matrix account renamed to @hermes-homelab-expert.
    # generation 11: rotated @hermes MATRIX_ACCESS_TOKEN + MATRIX_DEVICE_ID
    #   (tCzzQjNh1b -> dkfEMY1lhu) to recover E2EE. The old device's identity
    #   key rotated in place, so peers could not build Olm sessions with it and
    #   never delivered room keys. A new token yields a fresh device ID with no
    #   cached history on any peer client; the init container discards the
    #   now-stale crypto store in the same rollout.
    podAnnotations:
      kalitsune.net/env-generation: "11"

    # Sized from observation, not from the chart defaults (256Mi / 2Gi).
    #
    # The agent was OOMKilled (exit 137) on 2026-09-06 after ~3 days of
    # uptime. It was NOT a node problem: the node reported
    # MemoryPressure=False with ~11 GiB available at the time. The kill came
    # from this container's own cgroup hitting memory.max = 2Gi.
    #
    # Measured steady state shortly after a restart: memory.current ~1.15 GiB,
    # of which anon ~970 MiB (python3 ~340 MiB + two hermes procs ~540 MiB +
    # node ~250 MiB). So the floor is already >1 GiB and the old 2Gi cap left
    # roughly one context-window's worth of headroom before death.
    #
    # requests matter as much as limits here. The chart's 256Mi request put
    # this pod at oom_score_adj=984 — Kubernetes derives that for Burstable
    # pods as 1000 - 1000*request/nodeCapacity, so a request far below real
    # usage makes the pod the node's preferred OOM victim under any pressure.
    # Requesting ~1Gi (close to the true floor) drops it to ~934 and makes
    # scheduling honest, at the cost of reserving memory the pod genuinely
    # needs. Node requests go ~3.5 -> ~4.2 GiB of 15.1 GiB allocatable.
    #
    # The chart's CPU limit of 2 cores is deliberately left in place. Only
    # `memory` is overridden below, and Helm deep-merges values, so
    # limits.cpu: "2" from the chart survives — verified in the rendered
    # StatefulSet. That is fine: 2 cores on an otherwise idle worker is not a
    # meaningful constraint for this workload, and the failure being fixed
    # here is memory, not CPU.
    resources:
      requests:
        cpu: 100m
        memory: 1Gi
      limits:
        memory: 4Gi

    env:
      OPENAI_API_KEY: ""

    extraEnvFrom:
      - secretRef:
          name: hermes-secrets
      # Safe to mount directly now that this pod hosts ONE profile. Under
      # multiplexing this had to stay out of the process env: the default
      # profile read os.environ, claimed the credential first, and the gateway
      # refused to start the second adapter ("one credential cannot be
      # consumed twice") -- leaving the surviving adapter with no allowlist,
      # so every sender got a pairing code instead of a reply.
      - secretRef:
          name: hermes-matrix-secrets-default
    controller:
      type: statefulset
    persistence:
      storageClass: truenas-nfs
      accessModes:
        - ReadWriteMany
    service:
      enabled: true
      ports:
        - name: oauth2-proxy
          port: 4180
          targetPort: 4180
