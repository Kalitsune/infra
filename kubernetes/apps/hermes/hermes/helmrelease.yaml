apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes
  namespace: hermes
spec:
  interval: 30m
  chart:
    spec:
      chart: hermes-agent
      version: ">=1.11.0 <2.0.0"
      sourceRef:
        kind: HelmRepository
        name: hermes-agent
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    config:
      model:
        provider: anthropic
        default: claude-sonnet-5
      gateway:
        multiplex_profiles: true
        multiplex_profile_allowlist:
          - infra-expert

    extraVolumes:
      - name: hermes-profiles
        configMap:
          name: hermes-profiles
      - name: infra-expert-secrets
        secret:
          secretName: hermes-infra-expert-secrets

    extraInitContainers:
      - name: seed-profiles
        image: busybox:1.38
        command:
          - sh
          - -c
          - |
            set -eu
            src=/opt/hermes/skills
            cm=/hermes-profiles

            # Derive unique profile names from ConfigMap keys (<profile>--<file>)
            profiles=$(ls "$cm" | sed 's/--.*//' | sort -u)

            for profile in $profiles; do
              dest=/opt/data/profiles/$profile
              mkdir -p "$dest"

              for f in "$cm/$profile"--*; do
                [ -e "$f" ] || continue
                filename="${f##*--}"
                if [ "$filename" = "skills" ]; then
                  skills_dest="$dest/skills"
                  rm -rf "$skills_dest"
                  touch "$dest/.no-bundled-skills"
                  while IFS= read -r skill || [ -n "$skill" ]; do
                    [ -z "$skill" ] && continue
                    mkdir -p "$skills_dest/$(dirname "$skill")"
                    ln -s "$src/$skill" "$skills_dest/$(dirname "$skill")/"
                  done < "$f"
                else
                  cp "$f" "$dest/$filename"
                fi
              done

              echo "seeded profile: $profile"
            done

            # Seed per-profile .env from mounted secret volumes
            for profile in $profiles; do
              secrets_dir="/hermes-profile-secrets/$profile"
              [ -d "$secrets_dir" ] || continue
              dest=/opt/data/profiles/$profile
              mkdir -p "$dest"
              env_file="$dest/.env"
              : > "$env_file"
              for f in "$secrets_dir"/*; do
                [ -f "$f" ] || continue
                key="${f##*/}"
                printf '%s=%s\n' "$key" "$(cat "$f")" >> "$env_file"
              done
              echo "seeded .env for profile: $profile"
            done
        volumeMounts:
          - name: data
            mountPath: /opt/data
          - name: hermes-profiles
            mountPath: /hermes-profiles
            readOnly: true
          - name: infra-expert-secrets
            mountPath: /hermes-profile-secrets/infra-expert
            readOnly: true

    extraEnv:
      - name: HERMES_DASHBOARD
        value: "1"
      - name: HERMES_DASHBOARD_HOST
        value: "127.0.0.1"
      - name: HERMES_DASHBOARD_PUBLIC_URL
        value: "https://hermes.kalitsune.net"
      - name: HERMES_DASHBOARD_OIDC_ISSUER
        value: "https://id.kalitsune.net"
      - name: HERMES_DASHBOARD_OIDC_CLIENT_ID
        valueFrom:
          secretKeyRef:
            name: oauth2-proxy-secret
            key: clientId
      - name: HERMES_DASHBOARD_OIDC_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: oauth2-proxy-secret
            key: clientSecret
      - name: HASS_URL
        value: "http://192.168.1.164"
    extraContainers:
      - name: oauth2-proxy
        image: quay.io/oauth2-proxy/oauth2-proxy:v7.8.1
        args:
          - --provider=oidc
          - --oidc-issuer-url=https://id.kalitsune.net
          - --redirect-url=https://hermes.kalitsune.net/oauth2/callback
          - --upstream=http://127.0.0.1:9119
          - --http-address=0.0.0.0:4180
          - --email-domain=*
          - --cookie-secure=true
          - --cookie-name=_oauth2_proxy_hermes
          - --session-store-type=cookie
          - --banner="-"
          - --skip-provider-button=true
          - --code-challenge-method=S256
        env:
          - name: OAUTH2_PROXY_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: oauth2-proxy-secret
                key: clientId
          - name: OAUTH2_PROXY_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: oauth2-proxy-secret
                key: clientSecret
          - name: OAUTH2_PROXY_COOKIE_SECRET
            valueFrom:
              secretKeyRef:
                name: oauth2-proxy-secret
                key: cookieSecret
        ports:
          - name: http
            containerPort: 4180
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
        readinessProbe:
          httpGet:
            path: /ping
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext: {}
    env:
      OPENAI_API_KEY: ""

    extraEnvFrom:
      - secretRef:
          name: hermes-secrets
    controller:
      type: statefulset
    persistence:
      storageClass: truenas-nfs
      accessModes:
        - ReadWriteMany
    service:
      enabled: true
      ports:
        - name: oauth2-proxy
          port: 4180
          targetPort: 4180
