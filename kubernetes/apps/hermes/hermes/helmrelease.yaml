apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes
  namespace: hermes
spec:
  interval: 30m
  chart:
    spec:
      chart: hermes-agent
      version: ">=1.11.0 <2.0.0"
      sourceRef:
        kind: HelmRepository
        name: hermes-agent
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    service:
      enabled: true
      annotations:
        tailscale.com/expose: "true"
        tailscale.com/hostname: "hermes"
