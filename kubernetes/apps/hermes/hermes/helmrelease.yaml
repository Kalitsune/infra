apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes
  namespace: hermes
spec:
  interval: 30m
  chart:
    spec:
      chart: hermes-agent
      version: ">=1.11.0 <2.0.0"
      sourceRef:
        kind: HelmRepository
        name: hermes-agent
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3

  # Pin the two chart-version labels the chart stamps onto the PVC template.
  #
  # A StatefulSet's volumeClaimTemplates is IMMUTABLE, but the chart writes
  # `helm.sh/chart: hermes-agent-<version>` and
  # `app.kubernetes.io/version: <appVersion>` into
  # volumeClaimTemplates[0].metadata.labels. Both change on every chart
  # release, so the API server rejected the entire StatefulSet update:
  #
  #   StatefulSet.apps "hermes-hermes-agent" is invalid: spec: Forbidden:
  #   updates to statefulset spec for fields other than 'replicas', ...
  #
  # Since `version` above is a RANGE, this broke every automatic bump: Flux
  # retried, rolled back, and parked at Ready=False/RetriesExceeded while
  # still running the old chart — no values change could reach the cluster.
  # `upgrade.force` does not help; it is a replace-style patch and still
  # cannot mutate an immutable field.
  #
  # These values are deliberately FROZEN to what is on the live object, not
  # to the current chart version. They must match, or the upgrade is refused:
  #   kubectl -n hermes get sts hermes-hermes-agent \
  #     -o jsonpath='{.spec.volumeClaimTemplates[0].metadata.labels}'
  #
  # Only PVC-template metadata is affected, which is decorative — the pod
  # template, image and appVersion labels elsewhere still track the chart.
  postRenderers:
    - kustomize:
        patches:
          - target:
              version: v1
              kind: StatefulSet
              name: hermes-hermes-agent
            patch: |
              - op: replace
                path: /spec/volumeClaimTemplates/0/metadata/labels/helm.sh~1chart
                value: hermes-agent-1.12.1
              - op: replace
                path: /spec/volumeClaimTemplates/0/metadata/labels/app.kubernetes.io~1version
                value: v2026.8.27
  values:
    config:
      model:
        provider: anthropic
        default: claude-sonnet-5
      gateway:
        multiplex_profiles: true
        multiplex_profile_allowlist:
          - infra-expert

    extraVolumes:
      - name: hermes-profiles
        configMap:
          name: hermes-profiles
      - name: infra-expert-secrets
        secret:
          secretName: hermes-infra-expert-secrets
      # Managed scope: an IT-pinned config layer that Hermes merges over
      # EVERY profile's config.yaml, including profiles created at runtime
      # that this repo has never seen. Used to turn on the Honcho memory
      # provider globally — see kubernetes/apps/honcho/honcho/README.md.
      - name: hermes-managed
        configMap:
          name: hermes-managed
      - name: honcho-client-secrets
        secret:
          secretName: honcho-client-secrets
      # Per-profile env directories, assembled from several Secrets.
      #
      # Each holds that profile's OWN Matrix credential plus the shared LLM
      # provider credentials. Keys are selected explicitly rather than
      # projecting all of hermes-secrets: HASS_TOKEN is `required_env` for the
      # homeassistant platform, so seeding it into BOTH profiles would make
      # both configure that adapter with one token and trip the same
      # "refusing to start the duplicate" guard that broke Matrix. Home
      # Assistant stays on the process env, configured once by `default`.
      - name: infra-expert-env
        projected:
          sources:
            - secret:
                name: hermes-matrix-secrets
            - secret:
                name: hermes-secrets
                items:
                  - key: CLAUDE_CODE_OAUTH_TOKEN
                    path: CLAUDE_CODE_OAUTH_TOKEN
                  - key: GOOGLE_API_KEY
                    path: GOOGLE_API_KEY
      - name: default-env
        projected:
          sources:
            - secret:
                name: hermes-matrix-secrets-default
            - secret:
                name: hermes-secrets
                items:
                  - key: CLAUDE_CODE_OAUTH_TOKEN
                    path: CLAUDE_CODE_OAUTH_TOKEN
                  - key: GOOGLE_API_KEY
                    path: GOOGLE_API_KEY

    extraInitContainers:
      # The Honcho memory plugin ships in the Hermes image, but its SDK
      # (honcho-ai) does not. Without it the plugin logs "honcho-ai package
      # not installed — plugin inactive" at debug level and silently does
      # nothing: memory looks configured but never records or recalls.
      #
      # Hermes seals its own venv (HERMES_DISABLE_LAZY_INSTALLS=1) and
      # redirects runtime installs to HERMES_LAZY_INSTALL_TARGET on the data
      # volume, which hermes_bootstrap appends to sys.path at startup. This
      # installs into that same directory so the import resolves on boot.
      #
      # --no-deps is deliberate: honcho-ai needs only httpx>=0.28 and
      # pydantic>=2, both already in the core venv at compatible versions.
      # Pulling its own copies into an append-only path risks two versions of
      # pydantic in one interpreter.
      - name: install-honcho-sdk
        image: nousresearch/hermes-agent:v2026.8.27
        command:
          - sh
          - -c
          - |
            set -eu
            target=/opt/data/lazy-packages
            mkdir -p "$target"
            if [ -d "$target/honcho" ]; then
              echo "honcho-ai already present, skipping"
              exit 0
            fi
            uv pip install --target "$target" --no-deps 'honcho-ai==2.2.0'
            echo "installed honcho-ai into $target"
        volumeMounts:
          - name: data
            mountPath: /opt/data

      - name: seed-profiles
        image: busybox:1.38
        command:
          - sh
          - -c
          - |
            set -eu
            src=/opt/hermes/skills
            cm=/hermes-profiles

            # Derive unique profile names from ConfigMap keys (<profile>--<file>)
            profiles=$(ls "$cm" | sed 's/--.*//' | sort -u)

            for profile in $profiles; do
              dest=/opt/data/profiles/$profile
              mkdir -p "$dest"

              for f in "$cm/$profile"--*; do
                [ -e "$f" ] || continue
                filename="${f##*--}"
                if [ "$filename" = "skills" ]; then
                  skills_dest="$dest/skills"
                  mkdir -p "$skills_dest"
                  touch "$dest/.no-bundled-skills"

                  # Re-link the bundled skills listed in the ConfigMap, but
                  # remove ONLY what this container created on a previous run:
                  # the symlinks. The previous `rm -rf "$skills_dest"` also
                  # destroyed agent-authored skills, which are real
                  # directories here and exist in no ConfigMap, no image and
                  # no git tree — so every `helm upgrade` silently deleted
                  # them. It has already happened twice.
                  #
                  # Deleting links (never their targets) keeps this
                  # idempotent while making the wipe impossible.
                  find "$skills_dest" -type l -exec rm -f {} +
                  # Clear directories the link removal left empty, so a
                  # renamed/removed bundled category does not linger. -mindepth 1
                  # protects $skills_dest itself; real skills keep their files
                  # so they are never empty and never matched.
                  find "$skills_dest" -mindepth 1 -type d -empty -delete

                  while IFS= read -r skill || [ -n "$skill" ]; do
                    [ -z "$skill" ] && continue
                    mkdir -p "$skills_dest/$(dirname "$skill")"
                    ln -s "$src/$skill" "$skills_dest/$(dirname "$skill")/"
                  done < "$f"
                else
                  cp "$f" "$dest/$filename"
                fi
              done

              echo "seeded profile: $profile"
            done

            # Seed per-profile .env from mounted secret volumes
            for profile in $profiles; do
              secrets_dir="/hermes-profile-secrets/$profile"
              [ -d "$secrets_dir" ] || continue
              dest=/opt/data/profiles/$profile
              mkdir -p "$dest"
              env_file="$dest/.env"
              : > "$env_file"
              for f in "$secrets_dir"/*; do
                [ -f "$f" ] || continue
                key="${f##*/}"
                printf '%s=%s\n' "$key" "$(base64 -w0 "$f")" >> "$env_file"
              done

              # Verbatim (NOT base64) profile settings.
              #
              # Hermes never base64-decodes .env, so the loop above only works
              # because every consumer of those keys decodes them by hand
              # (bin/env.sh, bin/regen-*.py). That is right for multi-line
              # blobs like a kubeconfig or an SSH key, and wrong for anything
              # Hermes itself reads directly.
              #
              # These MUST live in the profile .env rather than in extraEnv.
              # With gateway.multiplex_profiles enabled, gateway/authz_mixin.py
              # reads allowlists through _auth_env() -> the per-profile secret
              # scope, and a scoped miss deliberately does NOT fall through to
              # os.environ (upstream issue #72348: falling through would leak
              # one profile's allowlist into another). MATRIX_* is not in
              # secret_scope._GLOBAL_ENV_EXACT/_PREFIXES, so a process env var
              # set via extraEnv is INVISIBLE to authorization and every sender
              # hits default-deny — the symptom is the bot answering a DM with
              # a pairing code instead of a reply.
              verbatim_dir="/hermes-profile-env/$profile"
              if [ -d "$verbatim_dir" ]; then
                for f in "$verbatim_dir"/*; do
                  [ -f "$f" ] || continue
                  key="${f##*/}"
                  # Single-line values only; strip any trailing newline so the
                  # value is not silently corrupted.
                  printf '%s=%s\n' "$key" "$(tr -d '\r\n' < "$f")" >> "$env_file"
                done
                echo "seeded verbatim env for profile: $profile"
              fi
            done

            # The DEFAULT profile is not in the hermes-profiles ConfigMap (it
            # has no SOUL.md/config.yaml of its own), so the loop above never
            # visits it — but it still runs a gateway and still needs its own
            # Matrix credential.
            #
            # Its home is the Hermes root, and /opt/data/.env is pre-existing
            # unmanaged state on the PVC holding API_SERVER_KEY and terminal
            # settings. So APPEND idempotently rather than truncating: drop any
            # previously-seeded MATRIX_ lines, then re-add the current ones.
            default_env_dir=/hermes-profile-env/default
            if [ -d "$default_env_dir" ]; then
              root_env=/opt/data/.env
              touch "$root_env"
              # Remove only keys we manage; everything else is preserved.
              grep -vE '^(MATRIX_|CLAUDE_CODE_OAUTH_TOKEN=|GOOGLE_API_KEY=)' \
                "$root_env" > "$root_env.tmp" 2>/dev/null || : > "$root_env.tmp"
              mv "$root_env.tmp" "$root_env"
              for f in "$default_env_dir"/*; do
                [ -f "$f" ] || continue
                key="${f##*/}"
                printf '%s=%s\n' "$key" "$(tr -d '\r\n' < "$f")" >> "$root_env"
              done
              chmod 600 "$root_env"
              echo "seeded verbatim env for profile: default"
            fi

            # Honcho memory config, written ONCE at the Hermes root rather
            # than per profile. The plugin resolves $HERMES_HOME/honcho.json
            # first and falls back to the root file, so every profile —
            # including ones created later at runtime — picks this up without
            # needing its own copy. Each profile still gets an isolated AI
            # peer (hermes_<profile>) while sharing the workspace, so they
            # share one view of the user but keep separate self-models.
            #
            # apiKey lives at the top level: the plugin only substitutes its
            # "local" placeholder for loopback/RFC1918 URLs, and a cluster DNS
            # name is neither, so the real JWT is required here.
            api_key="$(cat /honcho-client-secrets/HONCHO_API_KEY)"
            cat > /opt/data/honcho.json <<EOF
            {
              "enabled": true,
              "baseUrl": "http://honcho.honcho.svc.cluster.local:8000",
              "apiKey": "$api_key",
              "workspace": "hermes",
              "peerName": "kalitsune",
              "recallMode": "hybrid",
              "writeFrequency": "async",
              "sessionStrategy": "global",
              "saveMessages": true
            }
            EOF
            chmod 600 /opt/data/honcho.json
            echo "seeded honcho.json"
        volumeMounts:
          - name: data
            mountPath: /opt/data
          - name: hermes-profiles
            mountPath: /hermes-profiles
            readOnly: true
          - name: infra-expert-secrets
            mountPath: /hermes-profile-secrets/infra-expert
            readOnly: true
          - name: honcho-client-secrets
            mountPath: /honcho-client-secrets
            readOnly: true
          # Matrix settings, written VERBATIM into the profile .env (see the
          # verbatim block in the script above). Mounted as files so each key
          # becomes one .env line.
          - name: infra-expert-env
            mountPath: /hermes-profile-env/infra-expert
            readOnly: true
          # Default-profile credentials (@hermes:kalitsune.net). A SEPARATE
          # Matrix credential is mandatory, not cosmetic: the gateway refuses
          # to run two profiles on one Matrix token ("refusing to start the
          # duplicate — one credential cannot be consumed twice"), and the
          # loser's adapter never starts.
          - name: default-env
            mountPath: /hermes-profile-env/default
            readOnly: true

    extraVolumeMounts:
      # Managed scope directory. Hermes merges this config.yaml over every
      # profile's own, so `memory.provider: honcho` applies globally instead
      # of being copy-pasted into each profile's config.yaml.
      - name: hermes-managed
        mountPath: /etc/hermes
        readOnly: true

    extraEnv:
      - name: HERMES_DASHBOARD
        value: "1"
      - name: HERMES_DASHBOARD_HOST
        value: "127.0.0.1"
      - name: HERMES_DASHBOARD_PUBLIC_URL
        value: "https://hermes.kalitsune.net"
      - name: HERMES_DASHBOARD_OIDC_ISSUER
        value: "https://id.kalitsune.net"
      - name: HERMES_DASHBOARD_OIDC_CLIENT_ID
        valueFrom:
          secretKeyRef:
            name: oauth2-proxy-secret
            key: clientId
      - name: HERMES_DASHBOARD_OIDC_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: oauth2-proxy-secret
            key: clientSecret
      - name: HASS_URL
        value: "http://192.168.1.164"

      # The ONE Matrix variable that belongs in the process env.
      #
      # _get_matrix_recovery_key_output_target() reads this with a bare
      # os.getenv + Path.exists(), unlike _scoped_recovery_key() which is
      # scope-aware. Under multiplexing one gateway process hosts both
      # profiles, so os.environ mirrors the DEFAULT profile's .env and a
      # value placed in infra-expert's own .env is invisible here (it logged
      # "MATRIX_RECOVERY_KEY_OUTPUT_FILE is not configured" while holding the
      # key in its scoped env).
      #
      # Safe to share: the default profile carries MATRIX_RECOVERY_KEY, so it
      # takes the verify_with_recovery_key() branch and never reaches the
      # bootstrap path that reads this. Only infra-expert consumes it, once,
      # to write its generated key. Not a credential and not required_env for
      # any platform, so it cannot trip the duplicate-credential guard.
      #
      # Promote the written key into that profile's MATRIX_RECOVERY_KEY, then
      # this can go away.
      - name: MATRIX_RECOVERY_KEY_OUTPUT_FILE
        value: "/opt/data/export/matrix-recovery-infra-expert.txt"

      # NOTE: MATRIX_* settings are deliberately NOT here.
      #
      # They live in matrix-secret.yaml and are written verbatim into the
      # profile .env by seed-profiles. With gateway.multiplex_profiles on,
      # gateway/authz_mixin.py resolves allowlists through the per-profile
      # secret scope and a scoped miss does NOT fall back to os.environ, so a
      # value set here would be invisible to authorization and every sender
      # would be denied. See the Matrix section of README.md.
    extraContainers:
      - name: oauth2-proxy
        image: quay.io/oauth2-proxy/oauth2-proxy:v7.8.1
        args:
          - --provider=oidc
          - --oidc-issuer-url=https://id.kalitsune.net
          - --redirect-url=https://hermes.kalitsune.net/oauth2/callback
          - --upstream=http://127.0.0.1:9119
          - --http-address=0.0.0.0:4180
          - --email-domain=*
          - --cookie-secure=true
          - --cookie-name=_oauth2_proxy_hermes
          - --session-store-type=cookie
          - --banner="-"
          - --skip-provider-button=true
          - --code-challenge-method=S256
        env:
          - name: OAUTH2_PROXY_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: oauth2-proxy-secret
                key: clientId
          - name: OAUTH2_PROXY_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: oauth2-proxy-secret
                key: clientSecret
          - name: OAUTH2_PROXY_COOKIE_SECRET
            valueFrom:
              secretKeyRef:
                name: oauth2-proxy-secret
                key: cookieSecret
        ports:
          - name: http
            containerPort: 4180
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
        readinessProbe:
          httpGet:
            path: /ping
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext: {}
    # Bump whenever a value consumed through `envFrom` changes — most often
    # a rotated MATRIX_ACCESS_TOKEN in matrix-secret.yaml.
    #
    # A Secret read via envFrom is injected ONCE, at container start. Editing
    # it does NOT roll a StatefulSet: the pod template is unchanged, so
    # Kubernetes does nothing, Flux reports the Kustomization Ready, and the
    # running process keeps the OLD value. The symptom is a service that
    # looks deployed and healthy while failing every request.
    #
    # This bit us exactly once: rotating the Matrix account left the gateway
    # looping on `Matrix: sync error: Invalid token` against a correct Secret
    # it had never re-read. This annotation IS part of the pod template, so
    # bumping it in the same commit as the secret change is what applies it.
    #
    # generation 2: Matrix account renamed to @hermes-homelab-expert.
    podAnnotations:
      kalitsune.net/env-generation: "10"

    # Sized from observation, not from the chart defaults (256Mi / 2Gi).
    #
    # The agent was OOMKilled (exit 137) on 2026-09-06 after ~3 days of
    # uptime. It was NOT a node problem: the node reported
    # MemoryPressure=False with ~11 GiB available at the time. The kill came
    # from this container's own cgroup hitting memory.max = 2Gi.
    #
    # Measured steady state shortly after a restart: memory.current ~1.15 GiB,
    # of which anon ~970 MiB (python3 ~340 MiB + two hermes procs ~540 MiB +
    # node ~250 MiB). So the floor is already >1 GiB and the old 2Gi cap left
    # roughly one context-window's worth of headroom before death.
    #
    # requests matter as much as limits here. The chart's 256Mi request put
    # this pod at oom_score_adj=984 — Kubernetes derives that for Burstable
    # pods as 1000 - 1000*request/nodeCapacity, so a request far below real
    # usage makes the pod the node's preferred OOM victim under any pressure.
    # Requesting ~1Gi (close to the true floor) drops it to ~934 and makes
    # scheduling honest, at the cost of reserving memory the pod genuinely
    # needs. Node requests go ~3.5 -> ~4.2 GiB of 15.1 GiB allocatable.
    #
    # The chart's CPU limit of 2 cores is deliberately left in place. Only
    # `memory` is overridden below, and Helm deep-merges values, so
    # limits.cpu: "2" from the chart survives — verified in the rendered
    # StatefulSet. That is fine: 2 cores on an otherwise idle worker is not a
    # meaningful constraint for this workload, and the failure being fixed
    # here is memory, not CPU.
    resources:
      requests:
        cpu: 100m
        memory: 1Gi
      limits:
        memory: 4Gi

    env:
      OPENAI_API_KEY: ""

    extraEnvFrom:
      - secretRef:
          name: hermes-secrets
      # hermes-matrix-secrets is deliberately NOT mounted here.
      #
      # extraEnvFrom injects into the PROCESS env, which every profile can
      # read. The default profile has no secret scope installed, so it reads
      # os.environ directly, saw MATRIX_ACCESS_TOKEN, configured matrix, and
      # claimed the credential first — leaving:
      #
      #   ERROR gateway.run: Profile 'default' and 'infra-expert' both
      #   configure matrix with the same credential — refusing to start the
      #   duplicate (one credential cannot be consumed twice).
      #
      # The surviving adapter therefore belonged to `default`, whose .env has
      # no MATRIX_ALLOWED_USERS, so every sender hit default-deny and got a
      # pairing code. The bot still reacted to messages (lifecycle reactions
      # are added on receipt, before authorization) and then went silent,
      # which reads as "ghosting" rather than as an auth failure.
      #
      # Keeping the token out of the process env is what makes the profile
      # that actually owns the allowlist win. Each profile that needs Matrix
      # gets its OWN account, token and Secret seeded into its own .env.
    controller:
      type: statefulset
    persistence:
      storageClass: truenas-nfs
      accessModes:
        - ReadWriteMany
    service:
      enabled: true
      ports:
        - name: oauth2-proxy
          port: 4180
          targetPort: 4180
