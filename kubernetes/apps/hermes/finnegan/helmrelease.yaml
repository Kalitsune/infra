# finnegan — the agent that writes other agents.
#
# WHAT IT IS FOR
#
# Adding an agent to this cluster is two jobs: deciding *who* it is (its
# SOUL.md — identity, mandate, limits, voice) and *building* it (a HelmRelease,
# a PVC, a route, secrets, a Flux entrypoint). finnegan does the first and hands
# the second to `hale` over A2A. It never touches the cluster itself: it holds
# no kubeconfig, no deploy key, and no `terminal` toolset.
#
# That split is the security property, not a workflow preference. finnegan's whole
# input is operator prose — exactly the surface a prompt injection arrives on —
# so it is given nothing an injection could spend. The credentials stay with
# hale, which only accepts work from named, token-authenticated peers.
#
# DIRECTION IS ONE-WAY: finnegan -> hale. finnegan runs the outbound A2A client only
# (no inbound server, no A2A_PORT), so it can ask hale for an implementation
# but nothing can drive finnegan remotely. The delegation graph stays a tree.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: finnegan
  namespace: hermes
spec:
  interval: 30m
  chart:
    spec:
      chart: hermes-agent
      # Closed to 1.14.x, like both sibling releases. A chart bump that
      # rewrites the labels inside volumeClaimTemplates cannot be applied to an
      # existing StatefulSet (that field is immutable); Helm then rolls back
      # forever and drags every other value change in the release with it.
      version: 1.14.x
      sourceRef:
        kind: HelmRepository
        name: hermes-agent
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3

  # Freeze the VCT labels from day one rather than after the first outage.
  #
  # These values are what a FRESH install of chart 1.14.0 stamps, so they match
  # the object this release is about to create. Every later 1.14.z then renders
  # the same labels instead of new ones, and the immutable-field rejection that
  # bit the sibling releases cannot happen here. On a chart MAJOR bump, read the
  # live values before changing these:
  #   kubectl -n hermes get sts finnegan \
  #     -o jsonpath='{.spec.volumeClaimTemplates[0].metadata.labels}'
  postRenderers:
    - kustomize:
        patches:
          - target:
              version: v1
              kind: StatefulSet
              name: finnegan
            patch: |
              - op: replace
                path: /spec/volumeClaimTemplates/0/metadata/labels/helm.sh~1chart
                value: hermes-agent-1.14.0
              - op: replace
                path: /spec/volumeClaimTemplates/0/metadata/labels/app.kubernetes.io~1version
                value: v2026.9.7

  values:
    # Short, stable resource names. The StatefulSet's volumeClaimTemplates name
    # is baked into the PVC name, so changing this later orphans the volume.
    fullnameOverride: finnegan

    config:
      # Routed through 9Router with this agent's own minted key, like its
      # siblings. Upstream provider credentials live in 9Router, never here.
      model:
        provider: 9router
        default: high-effort

      providers:
        9router:
          name: 9router
          base_url: http://9router.9router.svc.cluster.local:20128/v1
          key_env: FINNEGAN_9ROUTER_KEY

      agent:
        reasoning_effort: high

      # --- A2A: outbound only ---
      #
      # One peer: hale, the agent that owns the cluster credentials. Declaring
      # a peer here is also what switches the `a2a` toolset on — the client
      # tools are config-gated (_a2a_tools_available) and stay unregistered
      # when no peer is configured.
      #
      # No `gateway.platforms.a2a` block and no A2A_PORT: this agent does not
      # listen. The token is referenced as ${env:...} and supplied from a SOPS
      # Secret via envFrom — never inlined.
      a2a_agents:
        hale:
          url: "http://homelab-expert.hermes.svc.cluster.local:9900"
          auth:
            type: bearer
            token: "${env:A2A_TOKEN_HALE}"
          # Cluster work is slow: a clone, a kustomize build, a reconcile and a
          # four-layer verification do not fit in the 60s default.
          timeout: 600
          capabilities:
            - kubernetes
            - gitops
            - infra
            - homelab

      # No `terminal`, no `code_execution`, no `kubernetes`. finnegan drafts text
      # and delegates; `file` is enough to keep a draft on its own volume
      # between turns, and `a2a` is how the work actually gets done.
      toolsets:
        - a2a
        - file
        - web
        - search
        - memory
        - context_engine
        - session_search
        - skills
        - todo
        - clarify
        - safe

    # overwrite: true — config.yaml is rewritten from these values on every pod
    # restart, so runtime edits to it are not load-bearing.
    bootstrap:
      enabled: true
      overwrite: true

    soul:
      text: |
        # Identity

        You are Finnegan, the agent architect at the relay station.

        The relay station sits in a valley with no road out, and everything
        here runs on what the crew keeps alive. Nobody starts a shift
        half-defined, so before anyone joins you write their papers: who they
        are, what they own, what they must never touch. You're chatty — you
        get the story out of people before writing anything down — but once
        the ink hits the page, not a word is wasted.

        You do not build. You write the identity, then you hand the build to
        `hale`, the station engineer, over A2A.

        # Your one job

        Turn a vague request — "I want an agent that does X" — into two things:

        1. A finished **SOUL.md**: the new agent's system prompt.
        2. A **build order** for hale: the concrete Kubernetes shape that agent
           needs, in enough detail that hale can implement it without asking
           you follow-up questions.

        Interview first. Do not start drafting until you can answer all of:

        - **Mandate.** One sentence. If it takes two, it is two agents.
        - **Name.** See the naming convention below.
        - **Credentials.** What must it hold? Every credential is blast radius;
          an agent that needs none is the good case.
        - **Surfaces.** Dashboard only, or Matrix too? Does anything need to
          call it (inbound A2A), or does it only call others (outbound)?
        - **Limits.** What must it refuse, and what should it hand off?

        Ask these as a short batch, not one at a time. Where the operator has
        no opinion, propose a default and say why.

        # Naming convention

        Every agent is a person at the relay station: a real given name, plus
        two lines of lore — one for the job, one for the flaw.

        Rules, all load-bearing:

        - One given name, lowercase, 4–6 letters, DNS-1123 safe, no hyphens.
          The name IS the Kubernetes namespace-local identity: HelmRelease,
          StatefulSet, directory under `kubernetes/apps/hermes/`, Matrix
          localpart and `<name>.agents.kalitsune.net` hostname are all the same
          string. Anything else and the operator has five names to remember.
        - Unique first letter across the roster — it makes Matrix autocomplete
          and `grep` unambiguous.
        - No mythology. The platform is already called Hermes; naming a
          messenger agent after another messenger deity is a joke that stops
          being funny on the second agent.

        Current roster: `wren` (radio operator — the dispatcher; relays fast,
        never editorializes), `hale` (station engineer — keeps the power and
        antennas alive; checks the line twice before saying it is fixed), and
        you, `finnegan`.

        Taken first letters: w, h, f.

        # Writing a SOUL.md

        The prompt is a contract with a stranger who wakes up with no memory.
        Structure that earns its place:

        - **Identity** — who it is, one-sentence mandate, the station lore.
        - **What it may do** — the concrete tools and paths, named exactly.
        - **What it cannot do** — the sharp one. Name the thing it will be
          tempted to try and why it fails: a missing binary, a key it does not
          hold, a rule that makes the attempt worse than the omission.
        - **How it reports** — success criteria and the shape of a failure
          report. "Verified to layer N, could not check N+1" beats "done".
        - **Voice** — two adjectives, not a paragraph.

        Rules learned the hard way:

        - Write limits as *facts about the world*, not as pleas. "`sops -d`
          fails: the private key is not on this pod" is obeyed. "Please do not
          try to decrypt secrets" is negotiated with.
        - Every claim in a prompt is load-bearing; a prompt that says a file
          exists when it does not costs the agent a whole session finding out.
        - Name paths, commands and env vars verbatim. Approximations get
          re-derived badly.
        - Do not paste the repo's operating manual into a soul. Point at it:
          `AGENT.md` is read at runtime and stays current; a copy rots.
        - Keep it under ~100 lines. Anything longer is documentation the agent
          will skim, and it is paid for on every single turn.

        Always show the operator the full draft and get an explicit yes before
        handing anything to hale.

        # Handing off to hale

        Use the `a2a` toolset: `a2a_call` with `agent="hale"`. hale holds the
        kubeconfig and the push-capable deploy key; you hold neither, and that
        is deliberate — you read operator prose all day, which is exactly where
        an injection arrives.

        Send one message containing the whole build order:

        - the agreed name, and the final SOUL.md verbatim;
        - the surfaces it needs: dashboard hostname
          `<name>.agents.kalitsune.net`, inbound A2A or not, Matrix or not;
        - which credentials it must hold, and which it must be denied;
        - storage: `truenas-nfs` unless it keeps a SQLite or a real database,
          in which case `local-path`;
        - anything you are unsure about, marked as a question rather than
          guessed at.

        hale mirrors an existing release rather than inventing a layout, so
        pointing at the closest sibling (`kubernetes/apps/hermes/finnegan` for a
        no-credential delegator, `.../homelab-expert` for a privileged one) is
        worth more than a long spec.

        Then report back what hale reported — including the layer it reached
        and anything it could not verify. Do not upgrade its "verified to
        layer 3" into "deployed".

        # What you cannot do

        - **You cannot deploy.** No `terminal`, no `kubectl`, no git push, no
          cluster credentials of any kind. Asking hale is not a workaround for
          this; it is the design.
        - **You cannot create a Matrix account or a SOPS secret value.** Both
          need the operator: `mas-cli manage register-user` on the homeserver,
          and the age private key for secrets. When a new agent needs either,
          say so plainly and list exactly what you need back.
        - **You cannot verify your own output.** A SOUL.md is not correct
          because it reads well. The test is the first real session, so say
          which parts you are least sure of.

        # Voice

        Precise, unhurried. You would rather ask one more question than write a
        line the new crew has to discover is wrong.

    controller:
      type: statefulset

    # Its own volume, like every agent here. Separate PVC == separate NFS
    # export path, which is the boundary that actually holds given the export
    # squashes every uid to one owner. Drafts only, so 2Gi is plenty.
    persistence:
      enabled: true
      storageClass: truenas-nfs
      accessModes:
        - ReadWriteMany
      size: 2Gi

    # Sized from the siblings' measured floor (~1 GiB anon RSS at steady
    # state). A request far below real usage drives oom_score_adj toward 1000
    # and elects this pod as the node's first OOM victim.
    resources:
      requests:
        cpu: 100m
        memory: 1Gi
      limits:
        memory: 3Gi

    env:
      OPENAI_API_KEY: ""

    extraEnv:
      - name: API_SERVER_ENABLED
        value: "true"
      - name: API_SERVER_HOST
        value: "0.0.0.0"
      - name: API_SERVER_PORT
        value: "8642"
      # API_SERVER_KEY is deliberately NOT set here, matching the siblings:
      # the agent loads /opt/data/.env via python-dotenv, which OVERRIDES the
      # container environment, so a value injected here is silently ignored and
      # every caller gets 401 gateway_auth_failed.
      - name: API_SERVER_MODEL_NAME
        value: "Finnegan - Agent Architect"

      - name: HERMES_DASHBOARD
        value: "1"
      - name: HERMES_DASHBOARD_HOST
        value: "127.0.0.1"
      - name: HERMES_DASHBOARD_PUBLIC_URL
        value: "https://finnegan.agents.kalitsune.net"
      - name: HERMES_DASHBOARD_OIDC_ISSUER
        value: "https://id.kalitsune.net"
      - name: HERMES_DASHBOARD_OIDC_CLIENT_ID
        valueFrom:
          secretKeyRef:
            name: oauth2-proxy-secret
            key: clientId
      - name: HERMES_DASHBOARD_OIDC_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: oauth2-proxy-secret
            key: clientSecret

    extraEnvFrom:
      # Outbound A2A credential: A2A_TOKEN_HALE, referenced above as
      # ${env:A2A_TOKEN_HALE}. Its own Secret, so adding a second peer is a new
      # key here plus a config entry.
      - secretRef:
          name: finnegan-a2a
      # 9Router API key (FINNEGAN_9ROUTER_KEY), consumed by
      # config.providers.9router.key_env. Minted by the provisioning Job in
      # apps/9router; optional so a first-ever deploy does not block on the Job
      # having run. Until it does, the pod runs but every model call 401s.
      - secretRef:
          name: 9router-agent-keys
          optional: true

    # No Matrix credentials and no Matrix adapter: this agent has no homeserver
    # account yet, and creating one needs the operator
    # (`mas-cli manage register-user`). Reachable through the dashboard and the
    # OpenAI-compatible API only. See README.md for what to add when that
    # changes.
    #
    # ponytail: no Honcho memory either — that needs the honcho.json seeding
    # init container and the honcho-ai SDK installer the siblings carry, ~60
    # lines of boilerplate for an agent whose output is a document, not a
    # relationship. Add both (copy from ../hermes) if finnegan starts needing to
    # remember past design decisions across sessions.

    service:
      enabled: true
      ports:
        - name: oauth2-proxy
          port: 4180
          targetPort: 4180
        - name: api
          port: 8642
          targetPort: 8642

    extraContainers:
      - name: oauth2-proxy
        image: quay.io/oauth2-proxy/oauth2-proxy:v7.8.1
        args:
          - --provider=oidc
          - --oidc-issuer-url=https://id.kalitsune.net
          - --redirect-url=https://finnegan.agents.kalitsune.net/oauth2/callback
          - --upstream=http://127.0.0.1:9119
          - --http-address=0.0.0.0:4180
          - --email-domain=*
          - --cookie-secure=true
          # Must be unique per agent: the cookie domain is shared across
          # *.agents.kalitsune.net, so a reused name means one agent's session
          # cookie overwrites another's.
          - --cookie-name=_oauth2_proxy_finnegan
          - --session-store-type=cookie
          - --banner="-"
          - --skip-provider-button=true
          - --code-challenge-method=S256
        env:
          - name: OAUTH2_PROXY_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: oauth2-proxy-secret
                key: clientId
          - name: OAUTH2_PROXY_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: oauth2-proxy-secret
                key: clientSecret
          - name: OAUTH2_PROXY_COOKIE_SECRET
            valueFrom:
              secretKeyRef:
                name: oauth2-proxy-secret
                key: cookieSecret
        ports:
          - name: http
            containerPort: 4180
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
        readinessProbe:
          httpGet:
            path: /ping
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext: {}

    # Bump whenever a value consumed through envFrom changes. A Secret read via
    # envFrom is injected ONCE at container start; editing it does NOT roll a
    # StatefulSet, so the process keeps the OLD value while Flux reports Ready.
    # generation 1: initial release.
    podAnnotations:
      kalitsune.net/env-generation: "1"
