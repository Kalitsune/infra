apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Deliberately NOT ../secret.yaml. The sibling releases include it because
  # they consume hermes-secrets (HASS_TOKEN, HONCHO_API_KEY); finnegan consumes
  # neither, and pulling the Secret in here would only add a second
  # Kustomization claiming ownership of the same object.
  #
  # The namespace and oauth2-proxy-secret are owned by the `hermes`
  # Kustomization, which this one dependsOn.
  - a2a-secret.yaml
  - helmrelease.yaml
  - httproute.yaml
