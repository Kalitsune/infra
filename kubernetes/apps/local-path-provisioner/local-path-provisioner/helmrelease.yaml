apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: local-path-provisioner
  namespace: local-path-provisioner
spec:
  interval: 30m
  chart:
    spec:
      chart: local-path-provisioner
      version: ">=0.0.28 <1.0.0"
      sourceRef:
        kind: HelmRepository
        name: local-path-provisioner
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    storageClass:
      create: true
      name: local-path
      defaultClass: false
