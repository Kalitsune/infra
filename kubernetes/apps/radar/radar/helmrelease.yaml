apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: radar
  namespace: radar
spec:
  interval: 30m
  chart:
    spec:
      chart: radar
      version: ">=1.12.0 <2.0.0"
      sourceRef:
        kind: HelmRepository
        name: skyhook
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Service
              name: radar
            patch: |
              - op: add
                path: /spec/loadBalancerClass
                value: tailscale
  values:
    service:
      type: LoadBalancer
      annotations:
        tailscale.com/hostname: "radar"
