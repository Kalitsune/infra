apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: umami
  namespace: agents
spec:
  parentRefs:
    - name: apps
      namespace: envoy-gateway-system
  hostnames:
    # umami is this agent's name; agents live under <name>.agents.kalitsune.net.
    # The older hostnames stay attached so bookmarks and the Pocket ID launch
    # URL do not 404 mid-cutover. Login (oauth2-proxy --redirect-url) is
    # registered on the NEW name only — that argument takes a single value — so
    # the legacy hosts serve already-authenticated sessions and redirect new
    # ones. Drop wren./hermes.kalitsune.net once nothing points at them.
    - umami.agents.kalitsune.net
    - wren.agents.kalitsune.net
    - hermes.kalitsune.net
  rules:
    # Hermes shows a login-method selection screen when /auth/login is visited
    # without a provider parameter. Adding ?provider=self-hosted skips that screen
    # and goes directly to the self-hosted OIDC flow (id.kalitsune.net).
    #
    # The primary redirect with full query-param preservation is handled by
    # the EnvoyPatchPolicy Lua filter in:
    #   kubernetes/apps/agents/hermes/hermes-auth-redirect.yaml
    #
    # The two rules below act as a fallback: if the Lua filter is not applied,
    # rule 2 redirects /auth/login to include the provider param (the next=
    # query param is dropped in that path, but the login still succeeds).
    # Rule 1 ensures requests that already carry provider=self-hosted pass
    # straight through, preventing a redirect loop in either case.

    # Rule 1 – pass through when provider is already set (prevents redirect loop)
    - matches:
        - path:
            type: Exact
            value: /auth/login
          queryParams:
            - name: provider
              type: Exact
              value: self-hosted
      backendRefs:
        - name: umami
          port: 4180

    # Rule 2 – fallback redirect to inject provider=self-hosted
    # (used only when the Lua filter in hermes-auth-redirect.yaml is not active)
    - matches:
        - path:
            type: Exact
            value: /auth/login
      filters:
        - type: RequestRedirect
          requestRedirect:
            statusCode: 302
            path:
              type: ReplaceFullPath
              replaceFullPath: /auth/login?provider=self-hosted

    # Rule 3 – all other traffic
    - backendRefs:
        - name: umami
          port: 4180
