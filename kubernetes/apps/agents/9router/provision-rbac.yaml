apiVersion: v1
kind: ServiceAccount
metadata:
  name: agents-9router-provisioner
  namespace: agents
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agents-9router-key-writer
  namespace: agents
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["9router-agent-keys"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agents-9router-key-writer
  namespace: agents
subjects:
  - kind: ServiceAccount
    name: agents-9router-provisioner
    namespace: agents
roleRef:
  kind: Role
  name: agents-9router-key-writer
  apiGroup: rbac.authorization.k8s.io
