apiVersion: apps/v1
kind: Deployment
metadata:
  name: exit-1
  namespace: netbird
spec:
  # Parked at 0 until the operator fills in real credentials. Both Secrets
  # currently hold placeholders, and gluetun exits on a malformed WireGuard key,
  # so a running replica is a guaranteed CrashLoopBackOff that buries real
  # alerts. Set this to 1 in the SAME commit that lands the real keys.
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: exit-1
  template:
    metadata:
      labels:
        app: exit-1
    spec:
      containers:
        - name: gluetun
          image: docker.io/qmcgaw/gluetun:v3.41.3
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - MKNOD
          envFrom:
            - secretRef:
                name: exit-1-vpn-secret
          env:
            - name: VPN_SERVICE_PROVIDER
              value: "custom"
            - name: VPN_TYPE
              value: "wireguard"
          # /dev/net/tun does not exist in this image and the pod cannot mount
          # hostPath, so the device node is created at start -- hence MKNOD.
          command:
            - "/bin/sh"
            - "-c"
            - "mkdir -p /dev/net && mknod /dev/net/tun c 10 200 || true; exec /gluetun-entrypoint"
        - name: netbird
          image: docker.io/netbirdio/netbird:0.80.0
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          envFrom:
            - secretRef:
                name: exit-1-netbird-secret
          # MTU 1200, below the 1280 default: this WireGuard interface runs
          # INSIDE gluetun's tunnel, so the provider's own overhead has already
          # eaten into the path MTU. At 1280 small requests work and large
          # transfers hang forever -- DNS resolves, pages never finish.
          command:
            - "/bin/sh"
            - "-c"
            - |
              set -e
              netbird service run &
              sleep 5
              netbird up --management-url "https://netbird.kalitsune.net" \
                --setup-key "$NB_SETUP_KEY" --mtu 1200
              # netbird issue #5391: a containerised exit node never gets the
              # 0.0.0.0/0 accept rule in netbird-rt-fwd, only per-route ones,
              # so mesh clients reach the peer and then get no internet. The
              # chain is rebuilt whenever a client reconnects, so this has to
              # keep re-asserting rather than run once. No nft in this image;
              # iptables (nf_tables backend) is present and works.
              while true; do
                if iptables -t filter -L netbird-rt-fwd >/dev/null 2>&1; then
                  iptables -C netbird-rt-fwd -j ACCEPT >/dev/null 2>&1 \
                    || iptables -I netbird-rt-fwd 1 -j ACCEPT
                fi
                sleep 60
              done
          # Without this the container reports Ready while `netbird up` is
          # failing to register, because the shell wrapper stays alive.
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "netbird status | grep -q 'Management: Connected'"]
            initialDelaySeconds: 20
            periodSeconds: 30
