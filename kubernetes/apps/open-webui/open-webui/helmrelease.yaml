apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
  namespace: open-webui
spec:
  interval: 30m
  chart:
    spec:
      chart: open-webui
      version: ">=16.5.0 <17.0.0"
      sourceRef:
        kind: HelmRepository
        name: open-webui
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    image:
      repository: ghcr.io/open-webui/open-webui
      tag: v0.11.3
    persistence:
      enabled: true
      storageClass: local-path
      size: 5Gi
      accessModes:
        - ReadWriteOnce
    ollama:
      enabled: false
    pipelines:
      enabled: false
    openaiApiKey: ""
    openaiBaseApiUrl: ""
    # Order is load-bearing: OPENAI_API_KEYS is a parallel `;`-joined list in
    # open-webui-openai-keys, matched to these URLs by index.
    #
    # Entry 4 is the LiteLLM proxy (apps/agents/router), which replaced the
    # direct 9Router connection. 9Router is still what ultimately serves the
    # models — the proxy holds its own minted key and fans out to it — but it
    # is no longer called from here, so there is one place to add retries,
    # a second upstream, or per-caller keys. Its credential is the router's
    # LITELLM_MASTER_KEY.
    #
    # The three agent entries stay direct: they are Hermes agents, not model
    # providers, and routing an agent through a model proxy would be
    # meaningless.
    openaiBaseApiUrls:
      - "http://umami.agents.svc.cluster.local:8642/v1"
      - "http://hale.agents.svc.cluster.local:8642/v1"
      - "http://finnegan.agents.svc.cluster.local:8642/v1"
      - "http://router.agents.svc.cluster.local:4000/v1"
    openaiApiKeysExistingSecret: "open-webui-openai-keys"
    openaiApiKeysExistingSecretKey: "keys"
    service:
      port: 80
      type: ClusterIP
    sso:
      enabled: true
      enableSignup: false
      oidc:
        enabled: true
        clientExistingSecret: "oauth2-proxy-secret"
        clientIdExistingSecretKey: "clientId"
        clientExistingSecretKey: "clientSecret"
        providerUrl: "https://id.kalitsune.net/.well-known/openid-configuration"
        providerName: "Pocket ID"
    extraEnvVars:
      - name: ENABLE_SIGNUP
        value: "false"
      - name: ENABLE_LOGIN_FORM
        value: "false"
      - name: ENABLE_LOCAL_WEB_FETCH
        value: "true"
      - name: OAUTH_CODE_CHALLENGE_METHOD
        value: "S256"
      # Pocket ID is the only account source: let it create the account on
      # first login (ENABLE_SIGNUP above stays false, so the local form can
      # still never create one).
      - name: ENABLE_OAUTH_SIGNUP
        value: "true"
      # Claim an existing local account when the Pocket ID email matches.
      # Only safe because Pocket ID verifies emails — an unverified-email IdP
      # would make this an account-takeover primitive.
      - name: OAUTH_MERGE_ACCOUNTS_BY_EMAIL
        value: "true"
      # Skip the "Continue with Pocket ID" click: /auth redirects straight to
      # the IdP. Requires exactly one provider, ENABLE_LOGIN_FORM=false (set
      # above) and no LDAP (ENABLE_LDAP unset = false), or it does nothing.
      # Escape hatch for a local login is /auth?form=true.
      - name: OAUTH_AUTO_REDIRECT
        value: "true"
      # Pocket ID is authoritative for identity, so re-read the claims each
      # login instead of freezing whatever the first login happened to send.
      - name: OAUTH_UPDATE_EMAIL_ON_LOGIN
        value: "true"
      - name: OAUTH_UPDATE_NAME_ON_LOGIN
        value: "true"
      # Sync avatar from Pocket ID (the "picture" claim) on every login
      - name: OAUTH_UPDATE_PICTURE_ON_LOGIN
        value: "true"
      # The chart only derives WEBUI_URL from ingress.host or route.hostnames,
      # and this release uses neither (the HTTPRoute is hand-written in
      # httproute.yaml), so it was empty and OAuth callback URLs fell back to
      # request.base_url. Must match httproute.yaml's hostname.
      - name: WEBUI_URL
        value: "https://open-webui.lab.kalitsune.net"
      # Open WebUI marks most settings PersistentConfig: on FIRST boot they
      # are copied from env into the SQLite `config` table, and from then on
      # the DB wins and the env var is ignored forever. That silently pinned
      # openai.api_base_urls to api.openai.com with the built-in placeholder
      # key, so no models ever appeared. false = re-read env every boot,
      # which is what makes this GitOps-managed rather than click-ops.
      - name: ENABLE_PERSISTENT_CONFIG
        value: "false"
      # Title / tags / follow-up / query generation ran as a FULL agent turn on
      # whichever model the chat used — so a chat with Hale posted meta-prompts
      # ("### Task: Suggest 3-5 relevant follow-up questions...") into a
      # cluster-admin agent on claude-opus-5-5, 27 tools and all. Opus 5.5
      # blocks those with "Terms of Service restrictions on reverse engineering
      # or duplicating model outputs" (14 refusals logged, 9 of them from this
      # path), and every one also burned a full agent context.
      #
      # TASK_MODEL_EXTERNAL pins all task generation to one model id that must
      # exist in the model list — "fast-af" is the 9Router combo (haiku), i.e.
      # the cheap lane, and it bypasses the agent connections entirely.
      # Open WebUI only honours it for external (non-local) connections, which
      # is every connection here.
      - name: TASK_MODEL_EXTERNAL
        value: "fast-af"
      - name: WEBUI_SECRET_KEY
        valueFrom:
          secretKeyRef:
            name: open-webui-secret
            key: WEBUI_SECRET_KEY
