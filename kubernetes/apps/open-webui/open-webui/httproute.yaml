apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: open-webui
  namespace: open-webui
spec:
  parentRefs:
    - name: apps
      namespace: envoy-gateway-system
  hostnames:
    - open-webui.lab.kalitsune.net
  rules:
    - backendRefs:
        - name: open-webui
          port: 80
