# RBAC for the key-provisioning Job.
#
# The Job needs to write a Secret into the `hermes` namespace, which is a
# different namespace from the one it runs in. That is expressed as a
# RoleBinding in `hermes` that references a ServiceAccount in `9router` —
# permissions are granted by the namespace that owns the resource, not by the
# one the caller lives in.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: 9router-provisioner
  namespace: 9router
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: 9router-key-writer
  namespace: hermes
rules:
  # Deliberately narrow: this can create and update exactly one Secret and
  # cannot read any other. `get` is required because `apply` reads before
  # writing; `patch` covers server-side apply, which is what the publish
  # container uses. `list`/`watch` are NOT granted, so this identity cannot
  # enumerate the namespace's other secrets (which include a cluster-admin
  # kubeconfig and a push-capable deploy key).
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["9router-agent-keys"]
    verbs: ["get", "update", "patch"]
  # `create` cannot be restricted by resourceName — the name does not exist
  # yet at admission time — so it is granted separately and the Job only ever
  # creates the one name above.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: 9router-key-writer
  namespace: hermes
subjects:
  - kind: ServiceAccount
    name: 9router-provisioner
    namespace: 9router
roleRef:
  kind: Role
  name: 9router-key-writer
  apiGroup: rbac.authorization.k8s.io
---
# Honcho consumes 9Router as its OpenAI-compatible LLM backend, so the same
# Job mints it a key. Honcho's process reads LLM_OPENAI_API_KEY via envFrom,
# which means the value has to land in a Secret in ITS namespace — hence a
# second, identical binding here rather than another key inside
# 9router-agent-keys.
#
# Deliberately a separate Secret name from honcho-secrets: that one is
# SOPS-encrypted in git and owned by Flux. Writing a Job-generated value into
# it would make the two writers fight on every reconcile.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: 9router-key-writer
  namespace: honcho
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["9router-honcho-key"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: 9router-key-writer
  namespace: honcho
subjects:
  - kind: ServiceAccount
    name: 9router-provisioner
    namespace: 9router
roleRef:
  kind: Role
  name: 9router-key-writer
  apiGroup: rbac.authorization.k8s.io
