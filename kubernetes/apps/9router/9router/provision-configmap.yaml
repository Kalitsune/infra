apiVersion: v1
kind: ConfigMap
metadata:
  name: 9router-provision
  namespace: 9router
data:
  # Provisions one API key per Hermes agent, directly in 9Router's SQLite
  # database, and writes each key to a file the agent pods can consume.
  #
  # WHY THE DATABASE AND NOT THE HTTP API
  #
  # /api/keys is guarded by the dashboard session cookie, so an automated
  # caller would have to log in with the shared password, scrape a cookie and
  # replay it — a fragile flow that breaks the moment the password is changed
  # in the UI (which it should be). The database is the same source of truth
  # the API writes to, and this container already has the volume mounted.
  #
  # KEY FORMAT — must match the app exactly or the key is rejected.
  # From chunk 241.js, generateApiKeyWithMachine():
  #
  #   suffix = 6 chars from [a-z0-9]
  #   check  = HMAC-SHA256(API_KEY_SECRET, machineId + suffix).hex[0:8]
  #   key    = `sk-${machineId}-${suffix}-${check}`
  #
  # API_KEY_SECRET defaults to "endpoint-proxy-api-key-secret" and is NOT set
  # on this Deployment, so the default applies. If it is ever set, this script
  # inherits the same env and stays correct.
  #
  # Lookup is `SELECT ... FROM apiKeys WHERE key = ?` against the plaintext
  # column, so the value written here is what the agent presents verbatim.
  provision-keys.js: |
    const crypto = require("crypto");
    const fs = require("fs");
    const path = require("path");
    const Database = require("better-sqlite3");

    const DB = "/app/data/db/data.sqlite";
    const OUT = "/provisioned";
    const SECRET = process.env.API_KEY_SECRET || "endpoint-proxy-api-key-secret";

    // machineId doubles as the stable identity of each consumer. Keep these
    // lowercase and hyphen-free: they become part of the key string.
    const AGENTS = (process.env.NINEROUTER_AGENTS || "hermes,homelabexpert")
      .split(",").map(s => s.trim()).filter(Boolean);

    // machineId -> the environment variable each consumer reads. The first
    // two are referenced by config.providers.9router.key_env in the two
    // HelmReleases; changing one without the other silently breaks the
    // provider.
    //
    // `laptop` is not an in-cluster workload — it is the operator's local
    // agent. Its key is minted here so every key has one provenance, and is
    // read out of the Secret by hand when needed. It is a distinct machineId
    // so it can be revoked in the dashboard without touching the agents.
    const ENV_NAMES = {
      hermes: "HERMES_9ROUTER_KEY",
      homelabexpert: "HOMELAB_EXPERT_9ROUTER_KEY",
      laptop: "LAPTOP_9ROUTER_KEY",
    };

    // Accumulates base64 key values for the Secret manifest written at the end.
    const secretData = {};

    function generate(machineId) {
      const alphabet = "abcdefghijklmnopqrstuvwxyz0123456789";
      let suffix = "";
      // crypto.randomInt, not Math.random: this value is a credential.
      for (let i = 0; i < 6; i++) {
        suffix += alphabet.charAt(crypto.randomInt(alphabet.length));
      }
      const check = crypto.createHmac("sha256", SECRET)
        .update(machineId + suffix).digest("hex").slice(0, 8);
      return `sk-${machineId}-${suffix}-${check}`;
    }

    // The app creates the schema on first boot. If this container wins the
    // race on a brand-new volume there is no table yet, so wait rather than
    // creating one and risking a divergent schema.
    let db;
    for (let attempt = 1; attempt <= 30; attempt++) {
      try {
        db = new Database(DB);
        const t = db.prepare(
          "SELECT name FROM sqlite_master WHERE type='table' AND name='apiKeys'"
        ).get();
        if (t) break;
        db.close();
        db = null;
      } catch (e) {
        if (db) { try { db.close(); } catch (_) {} db = null; }
      }
      console.log(`waiting for apiKeys table (${attempt}/30)`);
      // Busy-wait: this is a short-lived init container with no event loop.
      Atomics.wait(new Int32Array(new SharedArrayBuffer(4)), 0, 0, 2000);
    }
    if (!db) {
      console.error("apiKeys table never appeared; is 9router initialised?");
      process.exit(1);
    }

    fs.mkdirSync(OUT, { recursive: true });
    const insert = db.prepare(
      "INSERT INTO apiKeys(id, key, name, machineId, isActive, createdAt) " +
      "VALUES(?, ?, ?, ?, ?, ?)"
    );

    for (const agent of AGENTS) {
      const name = `${agent} (provisioned)`;
      // IDEMPOTENT: reuse the existing key for this machineId rather than
      // minting a second one on every pod restart. Agents cache the value,
      // so rotating silently would break them until they restarted too.
      const existing = db.prepare(
        "SELECT key FROM apiKeys WHERE machineId = ? AND isActive = 1 " +
        "ORDER BY createdAt ASC"
      ).get(agent);

      let key;
      if (existing) {
        key = existing.key;
        console.log(`${agent}: reusing existing key`);
      } else {
        key = generate(agent);
        insert.run(crypto.randomUUID(), key, name, agent, 1,
                   new Date().toISOString());
        console.log(`${agent}: created new key`);
      }

      // 0600, and the value never goes to stdout.
      const file = path.join(OUT, `${agent}.key`);
      fs.writeFileSync(file, key, { mode: 0o600 });
      console.log(`${agent}: wrote ${file} (${key.length} chars)`);
      secretData[ENV_NAMES[agent] || `${agent.toUpperCase()}_9ROUTER_KEY`] =
        Buffer.from(key, "utf8").toString("base64");
    }

    // Emit the Secret manifest for the publish step. That container runs a
    // DISTROLESS kubectl image with no shell, so it cannot pipe
    // `create --dry-run | apply`; it applies this file instead, which is
    // idempotent on re-run.
    const manifest = [
      "apiVersion: v1",
      "kind: Secret",
      "metadata:",
      "  name: 9router-agent-keys",
      "  namespace: hermes",
      "type: Opaque",
      "data:",
      ...Object.entries(secretData).map(([k, v]) => `  ${k}: ${v}`),
      "",
    ].join("\n");
    fs.writeFileSync(path.join(OUT, "secret.yaml"), manifest, { mode: 0o600 });
    console.log("wrote secret.yaml for the publish step");

    db.close();
    console.log("provisioning complete");

    // ------------------------------------------------------------------
    // Seed 9Router's own OIDC dashboard login.
    //
    // WHY THIS IS HERE AND NOT IN THE UI
    //
    // Every /api/settings* route is GET-only — the dashboard writes settings
    // through Next.js server actions, so there is no HTTP call to automate.
    // Configuring OIDC by hand would leave the client secret living only in
    // SQLite on the PVC, undeclared and lost on a volume restore. Writing it
    // here keeps the source of truth in git (SOPS-encrypted) and makes the
    // dashboard's auth reproducible.
    //
    // The credentials are the SAME Pocket ID client oauth2-proxy already
    // uses, mounted from the same Secret. Pocket ID accepts several redirect
    // URIs per client, so the operator adds this one alongside the existing
    // oauth2-proxy callback:
    //   https://9router.lab.kalitsune.net/api/auth/oidc/callback
    //
    // oidcConfigured is computed by the app as:
    //   !!(oidcIssuerUrl && oidcClientId && oidcClientSecret)
    // so all three must be present or the OIDC button never appears.
    //
    // The settings blob is PLAINTEXT JSON — the crypto elsewhere in the image
    // is for Cursor tokens, SAML and MITM, not for this. /api/settings strips
    // `password` and `oidcClientSecret` from its responses, so the secret is
    // redacted in transit but not at rest.
    const ISSUER = process.env.OIDC_ISSUER_URL || "";
    const CLIENT_ID = process.env.OIDC_CLIENT_ID || "";
    const CLIENT_SECRET = process.env.OIDC_CLIENT_SECRET || "";

    if (ISSUER && CLIENT_ID && CLIENT_SECRET) {
      const sdb = new Database(DB);
      const row = sdb.prepare("SELECT data FROM settings WHERE id = 1").get();
      let settings = {};
      if (row && row.data) {
        try { settings = JSON.parse(row.data); } catch (_) { settings = {}; }
      }

      // Merge, never replace: the app reads {...defaults, ...stored}, and this
      // row also carries provider routing, capacity and proxy configuration
      // that the operator edits in the UI. Overwriting it would silently
      // discard all of that.
      // authMode is the field the OIDC resolver actually gates on:
      //
      //   ["oidc","both"].includes(settings.authMode) && hasOidcFields(...)
      //     ? { issuerUrl, clientId, clientSecret, ... }
      //     : null
      //
      // ssoType only selects WHICH SSO flavour the login page offers (oidc vs
      // saml); it does not enable SSO. Setting ssoType alone leaves
      // /api/auth/status reporting oidcConfigured:true — because that is a
      // different, field-presence-only check — while /api/auth/oidc/start
      // still redirects to ?error=oidc_not_configured. Both must be set.
      //
      // "both" rather than "oidc": it keeps the INITIAL_PASSWORD fallback
      // working as a break-glass path. With "oidc", a misconfigured or
      // unreachable Pocket ID locks the dashboard out entirely — the only
      // recovery is editing SQLite by hand (or re-running this Job after
      // fixing the IdP). The operator confirmed they don't have a password
      // and wants OIDC-only; the break-glass path is this Job itself.
      settings.authMode = "oidc";
      settings.ssoType = "oidc";
      settings.oidcIssuerUrl = ISSUER;
      settings.oidcClientId = CLIENT_ID;
      settings.oidcClientSecret = CLIENT_SECRET;
      settings.oidcScopes = settings.oidcScopes || "openid profile email";
      settings.oidcLoginLabel = settings.oidcLoginLabel || "Sign in with Pocket ID";

      // requireLogin stays TRUE. The dashboard must still demand an identity;
      // the point of this block is to make that identity OIDC instead of a
      // shared password, not to remove the gate.
      settings.requireLogin = true;

      sdb.prepare(
        "INSERT INTO settings(id, data) VALUES(1, ?) " +
        "ON CONFLICT(id) DO UPDATE SET data = excluded.data"
      ).run(JSON.stringify(settings));
      sdb.close();

      console.log("OIDC dashboard login seeded (issuer set, ssoType=oidc)");
    } else {
      console.log("OIDC env not provided; leaving dashboard auth untouched");
    }

    // ---------------------------------------------------------------------
    // Token Saver (Headroom)
    //
    // Independent of the OIDC block above: the compression sidecar is part of
    // the Deployment, not of dashboard auth, so it must not silently stop
    // being configured if the OIDC env is ever removed.
    //
    // The sidecar runs in the 9router pod, so the built-in default
    // headroomUrl (http://localhost:8787) is already correct and is left
    // alone. Only headroomEnabled needs flipping: it defaults to false, which
    // would leave the sidecar running and never called.
    //
    // headroomCompressUserMessages stays FALSE. Measured in-cluster against
    // this exact image on a realistic agent conversation, all of the saving
    // came from tool results (smart_crusher on JSON): 17880 -> 6118 tokens,
    // a 66% reduction. A plain user turn was left untouched by the router
    // (router:protected:system_message), so enabling user-message rewriting
    // buys ~nothing and is the one place lossy compression would be felt.
    //
    // The pre-translate hook is fail-open: if the sidecar is down, slow, or
    // returns garbage, 9router forwards the ORIGINAL messages. Enabling this
    // cannot take routing down.
    {
      const sdb = new Database(DB);
      const row = sdb.prepare("SELECT data FROM settings WHERE id = 1").get();
      let settings = {};
      if (row && row.data) {
        try { settings = JSON.parse(row.data); } catch (_) { settings = {}; }
      }

      settings.headroomEnabled = true;
      settings.headroomCompressUserMessages = false;
      // Upstream default, applied per request. Compression of a large context
      // measured ~1s in-cluster, so this fails open quickly if it wedges.
      settings.headroomTimeoutMs = 3000;

      sdb.prepare(
        "INSERT INTO settings(id, data) VALUES(1, ?) " +
        "ON CONFLICT(id) DO UPDATE SET data = excluded.data"
      ).run(JSON.stringify(settings));
      sdb.close();

      console.log("Headroom token saver enabled (localhost:8787, tool results only)");
    }
