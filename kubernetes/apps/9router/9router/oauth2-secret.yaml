# OIDC client credentials for the 9Router dashboard, issued by Pocket ID.
#
# ============================ NOT ENCRYPTED YET ============================
# This file is a PLAINTEXT TEMPLATE. The agent cannot run SOPS encryption
# against real values because it has no age private key, so the operator
# fills these in and encrypts before this branch is merged:
#
#   1. In Pocket ID (https://id.kalitsune.net), create an OIDC client:
#        name         : 9Router
#        callback URL : https://9router.lab.kalitsune.net/oauth2/callback
#      Copy the generated client ID and secret.
#
#   2. Generate a cookie secret (must be exactly 16, 24 or 32 bytes,
#      base64-encoded — oauth2-proxy refuses to start otherwise):
#        openssl rand -base64 32 | tr -- '+/' '-_'
#
#   3. Fill the three values below, then:
#        sops -e -i kubernetes/apps/9router/9router/oauth2-secret.yaml
#
#   4. Confirm no plaintext survives:
#        grep -c 'ENC\[' kubernetes/apps/9router/9router/oauth2-secret.yaml
#
# DO NOT MERGE THIS BRANCH while these values are still readable. Flux would
# apply the Secret happily either way — the protection here is purely that
# the file never reaches main in this state.
# ===========================================================================
apiVersion: v1
kind: Secret
metadata:
  name: oauth2-proxy-secret
  namespace: 9router
type: Opaque
stringData:
  # From Pocket ID.
  clientId: "REPLACE_ME_CLIENT_ID"
  clientSecret: "REPLACE_ME_CLIENT_SECRET"
  # openssl rand -base64 32 | tr -- '+/' '-_'
  cookieSecret: "REPLACE_ME_COOKIE_SECRET"
