---
# The download stack proper. Every container here shares gluetun's network
# namespace (in Kubernetes all containers in a pod always do), which is exactly
# the old compose `network_mode: service:gluetun` behaviour: all torrent and
# indexer traffic leaves through the VPN or not at all.
#
# Nothing that must reach the public internet *outside* the tunnel belongs in
# this pod -- see the media-auth-proxy Deployment below for why.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: download-stack
  namespace: media
spec:
  replicas: 1
  serviceName: download-stack
  selector:
    matchLabels:
      app: download-stack
  template:
    metadata:
      labels:
        app: download-stack
    spec:
      # Grants the tailscale sidecar access to its own state Secret only.
      serviceAccountName: tailscale
      containers:
        - name: qbittorrent
          image: lscr.io/linuxserver/qbittorrent:latest
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Europe/Paris
            - name: WEBUI_PORT
              value: "8080"
            - name: TORRENTING_PORT
              value: "6881"
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: qbittorrent-config
              mountPath: /config
            - name: media-storage
              mountPath: /downloads
        - name: radarr
          image: lscr.io/linuxserver/radarr:latest
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Europe/Paris
          ports:
            - containerPort: 7878
          volumeMounts:
            - name: radarr-config
              mountPath: /config
            - name: media-storage
              mountPath: /downloads
        - name: sonarr
          image: lscr.io/linuxserver/sonarr:latest
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Europe/Paris
          ports:
            - containerPort: 8989
          volumeMounts:
            - name: sonarr-config
              mountPath: /config
            - name: media-storage
              mountPath: /downloads
        - name: prowlarr
          image: lscr.io/linuxserver/prowlarr:latest
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Europe/Paris
          ports:
            - containerPort: 9696
          volumeMounts:
            - name: prowlarr-config
              mountPath: /config
        - name: bazarr
          image: lscr.io/linuxserver/bazarr:latest
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Europe/Paris
          ports:
            - containerPort: 6767
          volumeMounts:
            - name: bazarr-config
              mountPath: /config
            - name: media-storage
              mountPath: /downloads
        - name: flaresolverr
          image: ghcr.io/flaresolverr/flaresolverr:latest
          env:
            - name: TZ
              value: Europe/Paris
            - name: LOG_LEVEL
              value: info
        # Plain Tailscale sidecar -- deliberately NOT the Tailscale Kubernetes
        # operator. Same role gluetun had: it owns the pod's egress path, and
        # every other container in this pod shares its network namespace.
        #
        # gluetun was removed because it cannot work here. The Mullvad add-on
        # is sold through Tailscale, and Tailscale generates and manages the
        # Mullvad account itself -- it never hands out a raw WireGuard private
        # key. The key we had was a leftover from the old standalone Mullvad
        # account and is no longer registered, which is why the handshake to
        # 193.32.127.84:51820 and .68:51820 was answered with silence
        # (tun0: TX 296 bytes, RX 0). Mullvad exit nodes are only reachable
        # through the tailnet, so the tailnet is how we reach them.
        - name: tailscale
          image: ghcr.io/tailscale/tailscale:v1.78.1
          securityContext:
            capabilities:
              add:
                # Needed to create the tailscale0 interface and install routes,
                # exactly as gluetun needed it for tun0. This is why the media
                # namespace runs with the `privileged` Pod Security level.
                - NET_ADMIN
          env:
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: tailscale-auth
                  key: TS_AUTHKEY
            - name: TS_KUBE_SECRET
              value: tailscale-state-download-stack
            # Must come BEFORE TS_EXTRA_ARGS: Kubernetes only expands $(VAR)
            # against variables declared earlier in the list. Declared after,
            # it would be passed through as the literal string
            # "--exit-node=$(TS_EXIT_NODE)" and tailscale would reject it.
            - name: TS_EXIT_NODE
              valueFrom:
                configMapKeyRef:
                  name: tailscale-exit-node
                  key: exitNode
            # NOT passed to `tailscale up`: --exit-node resolves its argument
            # against the current netmap, and at first boot the netmap is empty
            # because login has not happened yet. `tailscale up
            # --exit-node=ch-zrh-wg-001.mullvad.ts.net` therefore dies with
            # "invalid value ... must be IP or unique node name" and the
            # container crashloops. The exit node is applied by the postStart
            # hook below, once login has populated the netmap.
            # --reset is required because the postStart hook below writes prefs
            # (exit node, LAN access) that persist in the state Secret. On the
            # next start `tailscale up` sees those as non-default settings it
            # was not told about and refuses:
            #   "changing settings via 'tailscale up' requires mentioning all
            #    non-default flags"
            # which crashloops the container. --reset makes boot authoritative:
            # prefs always start clean, then the hook reapplies the exit node.
            - name: TS_EXTRA_ARGS
              value: --reset --hostname=download-stack
            - name: TS_USERSPACE
              value: "false"
            # Talos runs a pure-eBPF Cilium and ships no ip_tables module, so
            # tailscale's default iptables path dies with
            #   "can't initialize iptables table `filter'"
            #   "modprobe: Module ip_tables not found"
            # nftables is built into the Talos kernel and is the only firewall
            # backend that works here.
            - name: TS_DEBUG_FIREWALL_MODE
              value: nftables
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    # Pin egress to the Mullvad exit node once login has
                    # populated the netmap (it is empty at boot, which is why
                    # this is not passed to `tailscale up`).
                    #
                    # Deliberately never fails the container. Mullvad access is
                    # granted per-device in the admin console, so a brand new
                    # node has no Mullvad peers in its netmap until someone
                    # grants it a licence slot. Exiting non-zero there would
                    # crashloop the whole pod -- qBittorrent, all four *arr
                    # apps and flaresolverr -- over a console setting. Warn
                    # loudly in the log instead and let the stack run.
                    for i in $(seq 1 30); do
                      if tailscale set \
                           --exit-node="$TS_EXIT_NODE" \
                           --exit-node-allow-lan-access 2>/dev/null; then
                        echo "exit node set to $TS_EXIT_NODE"
                        exit 0
                      fi
                      sleep 2
                    done
                    echo "WARNING: could not set exit node '$TS_EXIT_NODE'." >&2
                    echo "WARNING: traffic is NOT going through Mullvad." >&2
                    echo "WARNING: grant this device Mullvad access at" >&2
                    echo "WARNING: login.tailscale.com/admin/settings/general" >&2
                    exit 0
      volumes:
        - name: media-storage
          persistentVolumeClaim:
            claimName: media-storage
        - name: qbittorrent-config
          persistentVolumeClaim:
            claimName: qbittorrent-config
        - name: radarr-config
          persistentVolumeClaim:
            claimName: radarr-config
        - name: sonarr-config
          persistentVolumeClaim:
            claimName: sonarr-config
        - name: prowlarr-config
          persistentVolumeClaim:
            claimName: prowlarr-config
        - name: bazarr-config
          persistentVolumeClaim:
            claimName: bazarr-config
---
# Raw app ports. Not exposed through the Gateway -- only the auth proxy below
# talks to these, so reaching them requires already being inside the cluster.
apiVersion: v1
kind: Service
metadata:
  name: download-stack
  namespace: media
spec:
  selector:
    app: download-stack
  ports:
    - name: qbit
      port: 8080
      targetPort: 8080
    - name: radarr
      port: 7878
      targetPort: 7878
    - name: sonarr
      port: 8989
      targetPort: 8989
    - name: prowlarr
      port: 9696
      targetPort: 9696
    - name: bazarr
      port: 6767
      targetPort: 6767
---
# The auth proxies live OUTSIDE the VPN pod on purpose.
#
# When they ran as sidecars of download-stack they inherited gluetun's network
# namespace, so their OIDC discovery call to id.kalitsune.net was forced through
# the tunnel and failed with:
#   "lookup id.kalitsune.net on 127.0.0.1:53: server misbehaving"
# (127.0.0.1:53 is gluetun's own DNS-over-TLS resolver). Even with a healthy
# tunnel this would mean hairpinning back to the home network from a Swiss exit
# node to reach an identity provider a few metres away.
#
# Out here they use normal cluster DNS, and reach the apps over the ClusterIP
# Service above. Torrent traffic stays in the tunnel; only auth leaves it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-auth-proxy
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app: media-auth-proxy
  template:
    metadata:
      labels:
        app: media-auth-proxy
    spec:
      containers:
        - name: radarr
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.8.1
          args:
            - --provider=oidc
            - --oidc-issuer-url=https://id.kalitsune.net
            - --redirect-url=https://radarr.lab.kalitsune.net/oauth2/callback
            - --upstream=http://download-stack.media.svc.cluster.local:7878
            - --http-address=0.0.0.0:4181
            - --email-domain=*
            - --cookie-secure=true
            - --cookie-name=_oauth2_proxy_radarr
            - --session-store-type=cookie
            - --banner=-
            - --skip-provider-button=true
            - --code-challenge-method=S256
            # The *arr stack is admin-only. Without --allowed-group any
            # authenticated Pocket ID user would get in; the groups scope must
            # be requested explicitly or the claim is absent and this check
            # silently passes nobody.
            - --scope=openid email profile groups
            - --oidc-groups-claim=groups
            - --allowed-group=admin
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secret-download
                  key: clientId
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secret-download
                  key: clientSecret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secret-download
                  key: cookieSecret
          ports:
            - containerPort: 4181
        - name: sonarr
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.8.1
          args:
            - --provider=oidc
            - --oidc-issuer-url=https://id.kalitsune.net
            - --redirect-url=https://sonarr.lab.kalitsune.net/oauth2/callback
            - --upstream=http://download-stack.media.svc.cluster.local:8989
            - --http-address=0.0.0.0:4182
            - --email-domain=*
            - --cookie-secure=true
            - --cookie-name=_oauth2_proxy_sonarr
            - --session-store-type=cookie
            - --banner=-
            - --skip-provider-button=true
            - --code-challenge-method=S256
            - --scope=openid email profile groups
            - --oidc-groups-claim=groups
            - --allowed-group=admin
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secret-download
                  key: clientId
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secret-download
                  key: clientSecret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secret-download
                  key: cookieSecret
          ports:
            - containerPort: 4182
        - name: prowlarr
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.8.1
          args:
            - --provider=oidc
            - --oidc-issuer-url=https://id.kalitsune.net
            - --redirect-url=https://prowlarr.lab.kalitsune.net/oauth2/callback
            - --upstream=http://download-stack.media.svc.cluster.local:9696
            - --http-address=0.0.0.0:4183
            - --email-domain=*
            - --cookie-secure=true
            - --cookie-name=_oauth2_proxy_prowlarr
            - --session-store-type=cookie
            - --banner=-
            - --skip-provider-button=true
            - --code-challenge-method=S256
            - --scope=openid email profile groups
            - --oidc-groups-claim=groups
            - --allowed-group=admin
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secret-download
                  key: clientId
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secret-download
                  key: clientSecret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secret-download
                  key: cookieSecret
          ports:
            - containerPort: 4183
        - name: bazarr
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.8.1
          args:
            - --provider=oidc
            - --oidc-issuer-url=https://id.kalitsune.net
            - --redirect-url=https://bazarr.lab.kalitsune.net/oauth2/callback
            - --upstream=http://download-stack.media.svc.cluster.local:6767
            - --http-address=0.0.0.0:4184
            - --email-domain=*
            - --cookie-secure=true
            - --cookie-name=_oauth2_proxy_bazarr
            - --session-store-type=cookie
            - --banner=-
            - --skip-provider-button=true
            - --code-challenge-method=S256
            - --scope=openid email profile groups
            - --oidc-groups-claim=groups
            - --allowed-group=admin
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secret-download
                  key: clientId
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secret-download
                  key: clientSecret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secret-download
                  key: cookieSecret
          ports:
            - containerPort: 4184
        - name: qbittorrent
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.8.1
          args:
            - --provider=oidc
            - --oidc-issuer-url=https://id.kalitsune.net
            - --redirect-url=https://torrent.lab.kalitsune.net/oauth2/callback
            - --upstream=http://download-stack.media.svc.cluster.local:8080
            - --http-address=0.0.0.0:4185
            - --email-domain=*
            - --cookie-secure=true
            - --cookie-name=_oauth2_proxy_qbittorrent
            - --session-store-type=cookie
            - --banner=-
            - --skip-provider-button=true
            - --code-challenge-method=S256
            - --scope=openid email profile groups
            - --oidc-groups-claim=groups
            - --allowed-group=admin
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secret-download
                  key: clientId
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secret-download
                  key: clientSecret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secret-download
                  key: cookieSecret
          ports:
            - containerPort: 4185
---
apiVersion: v1
kind: Service
metadata:
  name: media-auth-proxy
  namespace: media
spec:
  selector:
    app: media-auth-proxy
  ports:
    - name: proxy-radarr
      port: 4181
      targetPort: 4181
    - name: proxy-sonarr
      port: 4182
      targetPort: 4182
    - name: proxy-prowlarr
      port: 4183
      targetPort: 4183
    - name: proxy-bazarr
      port: 4184
      targetPort: 4184
    - name: proxy-qbit
      port: 4185
      targetPort: 4185
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: radarr
  namespace: media
spec:
  parentRefs:
    - name: apps
      namespace: envoy-gateway-system
  hostnames:
    - radarr.lab.kalitsune.net
  rules:
    - backendRefs:
        - name: media-auth-proxy
          port: 4181
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sonarr
  namespace: media
spec:
  parentRefs:
    - name: apps
      namespace: envoy-gateway-system
  hostnames:
    - sonarr.lab.kalitsune.net
  rules:
    - backendRefs:
        - name: media-auth-proxy
          port: 4182
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prowlarr
  namespace: media
spec:
  parentRefs:
    - name: apps
      namespace: envoy-gateway-system
  hostnames:
    - prowlarr.lab.kalitsune.net
  rules:
    - backendRefs:
        - name: media-auth-proxy
          port: 4183
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bazarr
  namespace: media
spec:
  parentRefs:
    - name: apps
      namespace: envoy-gateway-system
  hostnames:
    - bazarr.lab.kalitsune.net
  rules:
    - backendRefs:
        - name: media-auth-proxy
          port: 4184
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: torrent
  namespace: media
spec:
  parentRefs:
    - name: apps
      namespace: envoy-gateway-system
  hostnames:
    - torrent.lab.kalitsune.net
  rules:
    - backendRefs:
        - name: media-auth-proxy
          port: 4185
