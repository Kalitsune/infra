---
# The download stack proper. Every container here shares gluetun's network
# namespace (in Kubernetes all containers in a pod always do), which is exactly
# the old compose `network_mode: service:gluetun` behaviour: all torrent and
# indexer traffic leaves through the VPN or not at all.
#
# Nothing that must reach the public internet *outside* the tunnel belongs in
# this pod -- see the media-auth-proxy Deployment below for why.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: download-stack
  namespace: media
spec:
  replicas: 1
  serviceName: download-stack
  selector:
    matchLabels:
      app: download-stack
  template:
    metadata:
      labels:
        app: download-stack
    spec:
      containers:
        - name: qbittorrent
          image: lscr.io/linuxserver/qbittorrent:latest
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Europe/Paris
            - name: WEBUI_PORT
              value: "8080"
            - name: TORRENTING_PORT
              value: "6881"
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: qbittorrent-config
              mountPath: /config
            - name: media-storage
              mountPath: /downloads
        - name: radarr
          image: lscr.io/linuxserver/radarr:latest
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Europe/Paris
          ports:
            - containerPort: 7878
          volumeMounts:
            - name: radarr-config
              mountPath: /config
            - name: media-storage
              mountPath: /downloads
        - name: sonarr
          image: lscr.io/linuxserver/sonarr:latest
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Europe/Paris
          ports:
            - containerPort: 8989
          volumeMounts:
            - name: sonarr-config
              mountPath: /config
            - name: media-storage
              mountPath: /downloads
        - name: prowlarr
          image: lscr.io/linuxserver/prowlarr:latest
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Europe/Paris
          ports:
            - containerPort: 9696
          volumeMounts:
            - name: prowlarr-config
              mountPath: /config
        - name: bazarr
          image: lscr.io/linuxserver/bazarr:latest
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Europe/Paris
          ports:
            - containerPort: 6767
          volumeMounts:
            - name: bazarr-config
              mountPath: /config
            - name: media-storage
              mountPath: /downloads
        - name: flaresolverr
          image: ghcr.io/flaresolverr/flaresolverr:latest
          env:
            - name: TZ
              value: Europe/Paris
            - name: LOG_LEVEL
              value: info
        - name: gluetun
          image: qmcgaw/gluetun:latest
          securityContext:
            capabilities:
              add:
                # Required to create the tun0 WireGuard interface and install
                # the killswitch routes. This is why the media namespace runs
                # with the `privileged` Pod Security level.
                - NET_ADMIN
          env:
            - name: VPN_SERVICE_PROVIDER
              value: mullvad
            - name: VPN_TYPE
              value: wireguard
            - name: SERVER_CITIES
              value: Zurich
            - name: OWNED_ONLY
              value: "yes"
            - name: WIREGUARD_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: wg-secret
                  key: WG_KEY
            - name: WIREGUARD_ADDRESSES
              value: 10.72.212.153/32
            # Without this the killswitch drops cluster traffic, so kube-proxy
            # could not reach the app ports below and every Service backed by
            # this pod would time out. These are the pod CIDR, the service
            # CIDR and the home LAN -- local destinations that must bypass the
            # tunnel. Public traffic is unaffected and still VPN-only.
            - name: FIREWALL_OUTBOUND_SUBNETS
              value: 10.244.0.0/16,10.96.0.0/12,192.168.1.0/24
      volumes:
        - name: media-storage
          persistentVolumeClaim:
            claimName: media-storage
        - name: qbittorrent-config
          persistentVolumeClaim:
            claimName: qbittorrent-config
        - name: radarr-config
          persistentVolumeClaim:
            claimName: radarr-config
        - name: sonarr-config
          persistentVolumeClaim:
            claimName: sonarr-config
        - name: prowlarr-config
          persistentVolumeClaim:
            claimName: prowlarr-config
        - name: bazarr-config
          persistentVolumeClaim:
            claimName: bazarr-config
---
# Raw app ports. Not exposed through the Gateway -- only the auth proxy below
# talks to these, so reaching them requires already being inside the cluster.
apiVersion: v1
kind: Service
metadata:
  name: download-stack
  namespace: media
spec:
  selector:
    app: download-stack
  ports:
    - name: qbit
      port: 8080
      targetPort: 8080
    - name: radarr
      port: 7878
      targetPort: 7878
    - name: sonarr
      port: 8989
      targetPort: 8989
    - name: prowlarr
      port: 9696
      targetPort: 9696
    - name: bazarr
      port: 6767
      targetPort: 6767
---
# The auth proxies live OUTSIDE the VPN pod on purpose.
#
# When they ran as sidecars of download-stack they inherited gluetun's network
# namespace, so their OIDC discovery call to id.kalitsune.net was forced through
# the tunnel and failed with:
#   "lookup id.kalitsune.net on 127.0.0.1:53: server misbehaving"
# (127.0.0.1:53 is gluetun's own DNS-over-TLS resolver). Even with a healthy
# tunnel this would mean hairpinning back to the home network from a Swiss exit
# node to reach an identity provider a few metres away.
#
# Out here they use normal cluster DNS, and reach the apps over the ClusterIP
# Service above. Torrent traffic stays in the tunnel; only auth leaves it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-auth-proxy
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app: media-auth-proxy
  template:
    metadata:
      labels:
        app: media-auth-proxy
    spec:
      containers:
        - name: radarr
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.8.1
          args:
            - --provider=oidc
            - --oidc-issuer-url=https://id.kalitsune.net
            - --redirect-url=https://radarr.download.kalitsune.net/oauth2/callback
            - --upstream=http://download-stack.media.svc.cluster.local:7878
            - --http-address=0.0.0.0:4181
            - --email-domain=*
            - --cookie-secure=true
            - --cookie-name=_oauth2_proxy_radarr
            - --session-store-type=cookie
            - --banner=-
            - --skip-provider-button=true
            - --code-challenge-method=S256
            # The *arr stack is admin-only. Without --allowed-group any
            # authenticated Pocket ID user would get in; the groups scope must
            # be requested explicitly or the claim is absent and this check
            # silently passes nobody.
            - --scope=openid email profile groups
            - --oidc-groups-claim=groups
            - --allowed-group=admin
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secret-download
                  key: clientId
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secret-download
                  key: clientSecret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secret-download
                  key: cookieSecret
          ports:
            - containerPort: 4181
        - name: sonarr
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.8.1
          args:
            - --provider=oidc
            - --oidc-issuer-url=https://id.kalitsune.net
            - --redirect-url=https://sonarr.download.kalitsune.net/oauth2/callback
            - --upstream=http://download-stack.media.svc.cluster.local:8989
            - --http-address=0.0.0.0:4182
            - --email-domain=*
            - --cookie-secure=true
            - --cookie-name=_oauth2_proxy_sonarr
            - --session-store-type=cookie
            - --banner=-
            - --skip-provider-button=true
            - --code-challenge-method=S256
            - --scope=openid email profile groups
            - --oidc-groups-claim=groups
            - --allowed-group=admin
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secret-download
                  key: clientId
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secret-download
                  key: clientSecret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secret-download
                  key: cookieSecret
          ports:
            - containerPort: 4182
        - name: prowlarr
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.8.1
          args:
            - --provider=oidc
            - --oidc-issuer-url=https://id.kalitsune.net
            - --redirect-url=https://prowlarr.download.kalitsune.net/oauth2/callback
            - --upstream=http://download-stack.media.svc.cluster.local:9696
            - --http-address=0.0.0.0:4183
            - --email-domain=*
            - --cookie-secure=true
            - --cookie-name=_oauth2_proxy_prowlarr
            - --session-store-type=cookie
            - --banner=-
            - --skip-provider-button=true
            - --code-challenge-method=S256
            - --scope=openid email profile groups
            - --oidc-groups-claim=groups
            - --allowed-group=admin
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secret-download
                  key: clientId
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secret-download
                  key: clientSecret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secret-download
                  key: cookieSecret
          ports:
            - containerPort: 4183
        - name: bazarr
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.8.1
          args:
            - --provider=oidc
            - --oidc-issuer-url=https://id.kalitsune.net
            - --redirect-url=https://bazarr.download.kalitsune.net/oauth2/callback
            - --upstream=http://download-stack.media.svc.cluster.local:6767
            - --http-address=0.0.0.0:4184
            - --email-domain=*
            - --cookie-secure=true
            - --cookie-name=_oauth2_proxy_bazarr
            - --session-store-type=cookie
            - --banner=-
            - --skip-provider-button=true
            - --code-challenge-method=S256
            - --scope=openid email profile groups
            - --oidc-groups-claim=groups
            - --allowed-group=admin
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secret-download
                  key: clientId
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secret-download
                  key: clientSecret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secret-download
                  key: cookieSecret
          ports:
            - containerPort: 4184
        - name: qbittorrent
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.8.1
          args:
            - --provider=oidc
            - --oidc-issuer-url=https://id.kalitsune.net
            - --redirect-url=https://torrent.download.kalitsune.net/oauth2/callback
            - --upstream=http://download-stack.media.svc.cluster.local:8080
            - --http-address=0.0.0.0:4185
            - --email-domain=*
            - --cookie-secure=true
            - --cookie-name=_oauth2_proxy_qbittorrent
            - --session-store-type=cookie
            - --banner=-
            - --skip-provider-button=true
            - --code-challenge-method=S256
            - --scope=openid email profile groups
            - --oidc-groups-claim=groups
            - --allowed-group=admin
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secret-download
                  key: clientId
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secret-download
                  key: clientSecret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secret-download
                  key: cookieSecret
          ports:
            - containerPort: 4185
---
apiVersion: v1
kind: Service
metadata:
  name: media-auth-proxy
  namespace: media
spec:
  selector:
    app: media-auth-proxy
  ports:
    - name: proxy-radarr
      port: 4181
      targetPort: 4181
    - name: proxy-sonarr
      port: 4182
      targetPort: 4182
    - name: proxy-prowlarr
      port: 4183
      targetPort: 4183
    - name: proxy-bazarr
      port: 4184
      targetPort: 4184
    - name: proxy-qbit
      port: 4185
      targetPort: 4185
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: radarr
  namespace: media
spec:
  parentRefs:
    - name: apps
      namespace: envoy-gateway-system
  hostnames:
    - radarr.download.kalitsune.net
  rules:
    - backendRefs:
        - name: media-auth-proxy
          port: 4181
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sonarr
  namespace: media
spec:
  parentRefs:
    - name: apps
      namespace: envoy-gateway-system
  hostnames:
    - sonarr.download.kalitsune.net
  rules:
    - backendRefs:
        - name: media-auth-proxy
          port: 4182
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prowlarr
  namespace: media
spec:
  parentRefs:
    - name: apps
      namespace: envoy-gateway-system
  hostnames:
    - prowlarr.download.kalitsune.net
  rules:
    - backendRefs:
        - name: media-auth-proxy
          port: 4183
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bazarr
  namespace: media
spec:
  parentRefs:
    - name: apps
      namespace: envoy-gateway-system
  hostnames:
    - bazarr.download.kalitsune.net
  rules:
    - backendRefs:
        - name: media-auth-proxy
          port: 4184
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: torrent
  namespace: media
spec:
  parentRefs:
    - name: apps
      namespace: envoy-gateway-system
  hostnames:
    - torrent.download.kalitsune.net
  rules:
    - backendRefs:
        - name: media-auth-proxy
          port: 4185
