apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qbittorrent-config
  namespace: media
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: radarr-config
  namespace: media
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sonarr-config
  namespace: media
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prowlarr-config
  namespace: media
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bazarr-config
  namespace: media
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
# The download stack proper. Every container here shares gluetun's network
# namespace (in Kubernetes all containers in a pod always do), which is exactly
# the old compose `network_mode: service:gluetun` behaviour: all torrent and
# indexer traffic leaves through the VPN or not at all.
#
# Nothing that must reach the public internet *outside* the tunnel belongs in
# this pod -- see the media-auth-proxy Deployment below for why.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: download-stack
  namespace: media
spec:
  replicas: 1
  serviceName: download-stack
  selector:
    matchLabels:
      app: download-stack
  template:
    metadata:
      labels:
        app: download-stack
    spec:
      # Grants the tailscale sidecar access to its own state Secret only.
      serviceAccountName: tailscale
      initContainers:
        # qBittorrent has no declarative config surface: it reads
        # /config/qBittorrent/qBittorrent.conf off the PVC at boot and rewrites
        # the whole file on exit, so anything written here by hand is transient.
        # Authentication is already done by oauth2-proxy in front of it, while
        # qBittorrent's own login uses a password regenerated on every restart
        # and printed only to the container log -- i.e. nobody can log in, and
        # the WebUI answers 403. Disable that second login for callers that can
        # only be the proxy (pod network) or a sibling container in this pod
        # (localhost -- radarr/sonarr use qBittorrent as their download client).
        #
        # Reruns on every pod start, patching only these three keys and leaving
        # every other setting under qBittorrent's control. Same image as the app
        # container, so no extra pull.
        - name: qbt-auth-config
          image: lscr.io/linuxserver/qbittorrent:latest
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          command:
            - /bin/bash
            - -c
            - |
              set -eu
              conf=/config/qBittorrent/qBittorrent.conf
              tmp=$(mktemp)
              mkdir -p "$(dirname "$conf")"
              touch "$conf"
              grep -vF -e 'WebUI\AuthSubnetWhitelist=' \
                       -e 'WebUI\AuthSubnetWhitelistEnabled=' \
                       -e 'WebUI\LocalHostAuth=' "$conf" > "$tmp" || true
              grep -qF '[Preferences]' "$tmp" || printf '\n[Preferences]\n' >> "$tmp"
              awk '
                /^\[Preferences\]/ && !seen {
                  print
                  print "WebUI\\AuthSubnetWhitelist=0.0.0.0/0, ::/0"
                  print "WebUI\\AuthSubnetWhitelistEnabled=true"
                  print "WebUI\\LocalHostAuth=false"
                  seen = 1
                  next
                }
                { print }
              ' "$tmp" > "$conf"
              rm -f "$tmp"
              echo "--- patched $conf ---"
              cat "$conf"
          volumeMounts:
            - name: qbittorrent-config
              mountPath: /config
        - name: arr-auth-config
          image: busybox:latest
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              for app in radarr sonarr prowlarr; do
                conf="/$app/config.xml"
                if [ -f "$conf" ]; then
                  grep -q "<UrlBase>" "$conf" || sed -i 's|</Config>|  <UrlBase></UrlBase>\n</Config>|' "$conf"
                  sed -i "s|<UrlBase>.*</UrlBase>|<UrlBase>/$app</UrlBase>|" "$conf"
                fi
              done
              bz_conf="/bazarr/config/config.yaml"
              if [ -f "$bz_conf" ]; then
                sed -i "/^general:/,/^[^ ]/ s|^  base_url:.*|  base_url: '/bazarr'|" "$bz_conf"
                sed -i "/^radarr:/,/^[^ ]/ s|^  base_url:.*|  base_url: '/radarr'|" "$bz_conf"
                sed -i "/^sonarr:/,/^[^ ]/ s|^  base_url:.*|  base_url: '/sonarr'|" "$bz_conf"
                sed -i "/^subsarr:/,/^[^ ]/ s|^  base_url:.*|  base_url: ''|" "$bz_conf"
                sed -i "/^subsdump:/,/^[^ ]/ s|^  base_url:.*|  base_url: ''|" "$bz_conf"
              fi
          volumeMounts:
            - name: radarr-config
              mountPath: /radarr
            - name: sonarr-config
              mountPath: /sonarr
            - name: prowlarr-config
              mountPath: /prowlarr
            - name: bazarr-config
              mountPath: /bazarr
      containers:
        - name: qbittorrent
          image: lscr.io/linuxserver/qbittorrent:latest
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Europe/Paris
            - name: WEBUI_PORT
              value: "8080"
            - name: TORRENTING_PORT
              value: "6881"
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: qbittorrent-config
              mountPath: /config
            - name: media-storage
              mountPath: /downloads
        - name: radarr
          image: lscr.io/linuxserver/radarr:latest
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Europe/Paris
          ports:
            - containerPort: 7878
          volumeMounts:
            - name: radarr-config
              mountPath: /config
            - name: media-storage
              mountPath: /downloads
        - name: sonarr
          image: lscr.io/linuxserver/sonarr:latest
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Europe/Paris
          ports:
            - containerPort: 8989
          volumeMounts:
            - name: sonarr-config
              mountPath: /config
            - name: media-storage
              mountPath: /downloads
        - name: prowlarr
          image: lscr.io/linuxserver/prowlarr:latest
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Europe/Paris
          ports:
            - containerPort: 9696
          volumeMounts:
            - name: prowlarr-config
              mountPath: /config
        - name: bazarr
          image: lscr.io/linuxserver/bazarr:latest
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Europe/Paris
          ports:
            - containerPort: 6767
          volumeMounts:
            - name: bazarr-config
              mountPath: /config
            - name: media-storage
              mountPath: /downloads
        - name: flaresolverr
          image: ghcr.io/flaresolverr/flaresolverr:latest
          env:
            - name: TZ
              value: Europe/Paris
            - name: LOG_LEVEL
              value: info
        # Plain Tailscale sidecar -- deliberately NOT the Tailscale Kubernetes
        # operator. Same role gluetun had: it owns the pod's egress path, and
        # every other container in this pod shares its network namespace.
        #
        # gluetun was removed because it cannot work here. The Mullvad add-on
        # is sold through Tailscale, and Tailscale generates and manages the
        # Mullvad account itself -- it never hands out a raw WireGuard private
        # key. The key we had was a leftover from the old standalone Mullvad
        # account and is no longer registered, which is why the handshake to
        # 193.32.127.84:51820 and .68:51820 was answered with silence
        # (tun0: TX 296 bytes, RX 0). Mullvad exit nodes are only reachable
        # through the tailnet, so the tailnet is how we reach them.
        - name: tailscale
          image: ghcr.io/tailscale/tailscale:v1.78.1
          securityContext:
            capabilities:
              add:
                # Needed to create the tailscale0 interface and install routes,
                # exactly as gluetun needed it for tun0. This is why the media
                # namespace runs with the `privileged` Pod Security level.
                - NET_ADMIN
          env:
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: tailscale-auth
                  key: TS_AUTHKEY
            - name: TS_KUBE_SECRET
              value: tailscale-state-download-stack
            # Must come BEFORE TS_EXTRA_ARGS: Kubernetes only expands $(VAR)
            # against variables declared earlier in the list. Declared after,
            # it would be passed through as the literal string
            # "--exit-node=$(TS_EXIT_NODE)" and tailscale would reject it.
            - name: TS_EXIT_NODE
              valueFrom:
                configMapKeyRef:
                  name: tailscale-exit-node
                  key: exitNode
            # NOT passed to `tailscale up`: --exit-node resolves its argument
            # against the current netmap, and at first boot the netmap is empty
            # because login has not happened yet. `tailscale up
            # --exit-node=ch-zrh-wg-001.mullvad.ts.net` therefore dies with
            # "invalid value ... must be IP or unique node name" and the
            # container crashloops. The exit node is applied by the postStart
            # hook below, once login has populated the netmap.
            # --reset is required because the postStart hook below writes prefs
            # (exit node, LAN access) that persist in the state Secret. On the
            # next start `tailscale up` sees those as non-default settings it
            # was not told about and refuses:
            #   "changing settings via 'tailscale up' requires mentioning all
            #    non-default flags"
            # which crashloops the container. --reset makes boot authoritative:
            # prefs always start clean, then the hook reapplies the exit node.
            - name: TS_EXTRA_ARGS
              value: --reset --hostname=download-stack
            - name: TS_USERSPACE
              value: "false"
            # Talos runs a pure-eBPF Cilium and ships no ip_tables module, so
            # tailscale's default iptables path dies with
            #   "can't initialize iptables table `filter'"
            #   "modprobe: Module ip_tables not found"
            # nftables is built into the Talos kernel and is the only firewall
            # backend that works here.
            - name: TS_DEBUG_FIREWALL_MODE
              value: nftables
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    # Bypass Tailscale routing table for cluster IPs so inbound traffic
                    # (like oauth2-proxy) can receive responses instead of getting dropped.
                    ip rule add to 10.0.0.0/8 priority 5200 lookup main 2>/dev/null || true
                    
                    # Pin egress to the Mullvad exit node once login has
                    # populated the netmap (it is empty at boot, which is why
                    # this is not passed to `tailscale up`).
                    #
                    # Deliberately never fails the container. Mullvad access is
                    # granted per-device in the admin console, so a brand new
                    # node has no Mullvad peers in its netmap until someone
                    # grants it a licence slot. Exiting non-zero there would
                    # crashloop the whole pod -- qBittorrent, all four *arr
                    # apps and flaresolverr -- over a console setting. Warn
                    # loudly in the log instead and let the stack run.
                    for i in $(seq 1 30); do
                      if tailscale set \
                           --exit-node="$TS_EXIT_NODE" \
                           --exit-node-allow-lan-access 2>/dev/null; then
                        echo "exit node set to $TS_EXIT_NODE"
                        exit 0
                      fi
                      sleep 2
                    done
                    echo "WARNING: could not set exit node '$TS_EXIT_NODE'." >&2
                    echo "WARNING: traffic is NOT going through Mullvad." >&2
                    echo "WARNING: grant this device Mullvad access at" >&2
                    echo "WARNING: login.tailscale.com/admin/settings/general" >&2
                    exit 0
      volumes:
        - name: media-storage
          persistentVolumeClaim:
            claimName: media-storage
        - name: qbittorrent-config
          persistentVolumeClaim:
            claimName: qbittorrent-config
        - name: radarr-config
          persistentVolumeClaim:
            claimName: radarr-config
        - name: sonarr-config
          persistentVolumeClaim:
            claimName: sonarr-config
        - name: prowlarr-config
          persistentVolumeClaim:
            claimName: prowlarr-config
        - name: bazarr-config
          persistentVolumeClaim:
            claimName: bazarr-config
---
# Raw app ports. Not exposed through the Gateway -- only the auth proxy below
# talks to these, so reaching them requires already being inside the cluster.
apiVersion: v1
kind: Service
metadata:
  name: download-stack
  namespace: media
spec:
  selector:
    app: download-stack
  ports:
    - name: qbit
      port: 8080
      targetPort: 8080
    - name: radarr
      port: 7878
      targetPort: 7878
    - name: sonarr
      port: 8989
      targetPort: 8989
    - name: prowlarr
      port: 9696
      targetPort: 9696
    - name: bazarr
      port: 6767
      targetPort: 6767
