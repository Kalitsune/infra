apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kavita-config
  namespace: media
spec:
  accessModes: [ReadWriteOnce]
  # Kavita keeps its whole state (users, series metadata, read progress) in an
  # embedded SQLite database under /config, plus a cover-image cache. SQLite
  # over NFS corrupts silently, so this claim is deliberately local-path and
  # must not be "fixed" to the repo default. Pinned to the worker node; no
  # TrueNAS snapshots, so back up /config/config/kavita.db at the app layer.
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
# Kavita: reading server for comics, manga and ebooks.
# LSIO image rather than the official jvmilazz0/kavita because it honours
# PUID/PGID -- the media PVC is owned 1000:1000 -- and keeps config at /config
# instead of /kavita/config. Switching registries later means moving that
# mount, not just the image tag.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kavita
  namespace: media
spec:
  replicas: 1
  strategy:
    # SQLite: RollingUpdate's maxSurge would start the new pod while the old one
    # still has the database open on the same PVC. Recreate trades a few seconds
    # of downtime for not having two writers.
    type: Recreate
  selector:
    matchLabels:
      app: kavita
  template:
    metadata:
      labels:
        app: kavita
    spec:
      initContainers:
        # Kavita reads Authority/ClientId/Secret for OIDC from
        # /config/appsettings.json ONLY, at process start -- there is no env var
        # for them (Kavita.Common/Configuration.cs), and the admin UI writes the
        # same file. Seeding the whole file is not an option: it also holds
        # TokenKey, which Kavita generates on first run and which invalidates
        # every session if it changes. So patch just the OIDC object, in place,
        # on every start, and leave the rest of the file to Kavita.
        #
        # jq ships in the LSIO image (verified: /usr/bin/jq), so no extra image
        # and no shell-quoting of the secret -- it arrives as a jq --arg.
        # Runs as root like the app container (LSIO s6 init drops to abc:1000
        # itself) and restores ownership afterwards.
        #
        # Sets the three keys individually rather than replacing the whole
        # OpenIdConnectSettings object: a wholesale replace would also wipe
        # CustomScopes on every pod start, silently reverting a scope the
        # operator added in the admin UI. CustomScopes is seeded with `groups`
        # (Pocket ID's claim) only when empty, so role sync has the claim
        # available but the UI stays authoritative afterwards.
        - name: oidc-config
          image: lscr.io/linuxserver/kavita:latest
          command:
            - /bin/bash
            - -c
            - |
              set -eu
              f=/config/appsettings.json
              # First boot: the app container's own init copies the template,
              # but it has not run yet. Same source file it would use.
              [ -f "$f" ] || cp /defaults/appsettings-init.json "$f"
              tmp=$(mktemp)
              jq --arg a "$AUTHORITY" \
                 --arg c "$OIDC_CLIENT_ID" \
                 --arg s "$OIDC_CLIENT_SECRET" \
                 '.OpenIdConnectSettings.Authority = $a
                  | .OpenIdConnectSettings.ClientId = $c
                  | .OpenIdConnectSettings.Secret = $s
                  | .OpenIdConnectSettings.CustomScopes =
                      (.OpenIdConnectSettings.CustomScopes
                       | if length > 0 then . else ["groups"] end)' \
                 "$f" > "$tmp"
              cat "$tmp" > "$f"
              rm -f "$tmp"
              chown 1000:1000 "$f"
          env:
            - name: AUTHORITY
              value: https://id.kalitsune.net
          envFrom:
            - secretRef:
                name: kavita-oidc
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: kavita
          image: lscr.io/linuxserver/kavita:latest
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Europe/Paris
          ports:
            - containerPort: 5000
          # /api/health is unauthenticated and returns 200 once Kestrel is up
          # and the migrations have run.
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /config
            # Only the Books subtree of the shared media PVC, so Kavita's
            # library scanner never walks the film and series directories.
            # kubelet creates the subPath on first mount.
            - name: media
              mountPath: /data
              subPath: Books
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: kavita-config
        - name: media
          persistentVolumeClaim:
            claimName: media-storage
---
apiVersion: v1
kind: Service
metadata:
  name: kavita
  namespace: media
spec:
  selector:
    app: kavita
  ports:
    - port: 5000
      targetPort: 5000
---
# Public, on request: a reading app is for reading from outside the house, same
# reasoning as jellyfin on watch.kalitsune.net. Kavita authenticates every
# request itself (its own accounts plus Pocket ID OIDC below), so it is not
# bare on the internet the way a `lab.` admin dashboard would be.
#
# The apex has no wildcard CNAME -- *.kalitsune.net does not exist in the zone,
# only *.lab / *.hermes / *.agents -- so read.kalitsune.net is its own CNAME
# to lab.kalitsune.net. TLS is already covered by the *.kalitsune.net SAN on
# the apps-tls certificate.
#
# Hostname is read.kalitsune.net, renamed from kavita.kalitsune.net at the
# operator's request. Kavita builds its OIDC redirect_uri from the request Host,
# so the hostname here is also what Pocket ID must have registered as a callback
# -- see README. The old kavita.kalitsune.net name and CNAME are gone.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kavita
  namespace: media
spec:
  parentRefs:
    - name: apps
      namespace: envoy-gateway-system
  hostnames:
    - read.kalitsune.net
  rules:
    - backendRefs:
        - name: kavita
          port: 5000
