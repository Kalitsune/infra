apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - app.yaml

# Abyss theme assets. Generated rather than hand-written Secrets/ConfigMaps so
# the name carries a content hash -- editing a file here renames the ConfigMap,
# which rolls the Deployment. A hand-written ConfigMap would update in place and
# leave the running pod serving the old CSS.
configMapGenerator:
  # Served by Jellyfin as /web/ui/*.
  - name: jellyfin-abyss-web
    files:
      - abyss/abyss.css
      - abyss/spotlight.html
      - abyss/spotlight.css
      - abyss/spotlight-loader.js
  # Copied onto the PVC by the abyss-theme init container.
  - name: jellyfin-abyss-config
    files:
      - abyss/Jellyfin.Plugin.FileTransformation.xml
