apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyseerr-config
  namespace: media
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
# Seerr: the merged successor to Jellyseerr + Overseerr.
# Image: ghcr.io/seerr-team/seerr (replaces fallenbagel/jellyseerr).
# Migration from Jellyseerr is automatic on first start -- it reads the
# existing DB from the PVC without manual intervention.
#
# Key differences from Jellyseerr:
# - `init: true` equivalent (see securityContext below)
# - Runs as uid 1000 (node user), not root
# - Config mount is /app/config (same as Jellyseerr, unlike Overseerr's /config)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyseerr
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jellyseerr
  template:
    metadata:
      labels:
        app: jellyseerr
    spec:
      # The container image does not include an init process. Without this
      # zombie processes from health checks accumulate and eventually exhaust
      # the PID limit.
      shareProcessNamespace: true
      containers:
        - name: seerr
          image: ghcr.io/seerr-team/seerr:latest
          env:
            - name: TZ
              value: Europe/Paris
          ports:
            - containerPort: 5055
          volumeMounts:
            - name: config
              mountPath: /app/config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jellyseerr-config
---
apiVersion: v1
kind: Service
metadata:
  name: jellyseerr
  namespace: media
spec:
  selector:
    app: jellyseerr
  ports:
    - port: 5055
      targetPort: 5055
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellyseerr
  namespace: media
spec:
  parentRefs:
    - name: apps
      namespace: envoy-gateway-system
  hostnames:
    - requests.watch.kalitsune.net
  rules:
    - backendRefs:
        - name: jellyseerr
          port: 5055
