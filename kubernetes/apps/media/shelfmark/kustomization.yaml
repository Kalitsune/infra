apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - app.yaml
  - patch-cm.yaml
# No httproute.yaml here, which is the exception to the repo rule that an app
# ships its own route. Shelfmark is served as /shelfmark on the existing
# download-stack.geod.es host so it inherits that route's Pocket ID
# SecurityPolicy: a SecurityPolicy targets an HTTPRoute by name, so a separate
# route would need its own OIDC client and its own callback registered in
# Pocket ID. The rule lives in ../download-stack-dashboard/httproute.yaml.
