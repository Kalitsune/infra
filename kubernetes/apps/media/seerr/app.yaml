apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  # Renamed from "jellyseerr-config" by copying the data into this new claim
  # while the Deployment was scaled to 0 (local-path is reclaimPolicy: Delete,
  # so the old PV died with the old claim on the next prune). Any future rename
  # needs the same copy-then-switch dance, never a bare find-and-replace.
  name: seerr-config
  namespace: media
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
# Seerr: the merged successor to Jellyseerr + Overseerr.
# Image: ghcr.io/seerr-team/seerr (replaces fallenbagel/jellyseerr).
# Migration from Jellyseerr is automatic on first start -- it reads the
# existing DB from the PVC without manual intervention.
#
# Key differences from Jellyseerr:
# - `init: true` equivalent (see securityContext below)
# - Runs as uid 1000 (node user), not root
# - Config mount is /app/config (same as Jellyseerr, unlike Overseerr's /config)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seerr
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seerr
  template:
    metadata:
      labels:
        app: seerr
    spec:
      # The container image does not include an init process. Without this
      # zombie processes from health checks accumulate and eventually exhaust
      # the PID limit.
      shareProcessNamespace: true
      # Seerr runs as uid 1000 (node), but the config tree was inherited from
      # Jellyseerr which ran as root. An init container fixes ownership once;
      # after that Seerr itself maintains the files.
      initContainers:
        - name: fix-perms
          image: busybox:latest
          command: ["sh", "-c", "chown -R 1000:1000 /app/config"]
          volumeMounts:
            - name: config
              mountPath: /app/config
      containers:
        - name: seerr
          image: ghcr.io/seerr-team/seerr:latest
          env:
            - name: TZ
              value: Europe/Paris
          ports:
            - containerPort: 5055
          volumeMounts:
            - name: config
              mountPath: /app/config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: seerr-config
---
apiVersion: v1
kind: Service
metadata:
  name: seerr
  namespace: media
spec:
  selector:
    app: seerr
  ports:
    - port: 5055
      targetPort: 5055
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: seerr
  namespace: media
spec:
  parentRefs:
    - name: apps
      namespace: envoy-gateway-system
  hostnames:
    - requests.watch.kalitsune.net
  rules:
    - backendRefs:
        - name: seerr
          port: 5055
