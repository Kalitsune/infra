apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: download-stack-dashboard
  namespace: media
spec:
  directResponse:
    contentType: text/html
    statusCode: 200
    body:
      type: ValueRef
      valueRef:
        group: ""
        kind: ConfigMap
        name: download-stack-dashboard-html
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: download-stack-dashboard
  namespace: media
spec:
  parentRefs:
    - name: apps
      namespace: envoy-gateway-system
  hostnames:
    - download-stack.lab.kalitsune.net
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /radarr
      backendRefs:
        - name: download-stack
          port: 7878
    - matches:
        - path:
            type: PathPrefix
            value: /sonarr
      backendRefs:
        - name: download-stack
          port: 8989
    - matches:
        - path:
            type: PathPrefix
            value: /prowlarr
      backendRefs:
        - name: download-stack
          port: 9696
    - matches:
        - path:
            type: PathPrefix
            value: /bazarr
      backendRefs:
        - name: download-stack
          port: 6767
    - matches:
        - path:
            type: PathPrefix
            value: /torrent
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: download-stack
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: download-stack-dashboard
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: download-stack-dashboard
  namespace: media
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: download-stack-dashboard
  oidc:
    provider:
      issuer: https://id.kalitsune.net
    clientID: b076b66b-a080-4e7f-8154-80b9028337d8
    clientSecret:
      name: download-stack-dashboard-oidc
    redirectURL: https://download-stack.lab.kalitsune.net/oauth2/callback
    logoutPath: /logout
    cookieNames:
      accessToken: download_stack_token
      idToken: download_stack_id
