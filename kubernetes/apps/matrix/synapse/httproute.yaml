apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: synapse
  namespace: matrix
spec:
  parentRefs:
    - name: apps
      namespace: envoy-gateway-system
  hostnames:
    - matrix.kalitsune.net
  rules:
    - timeouts:
        backendRequest: 180s
        request: 180s
      backendRefs:
        - name: synapse
          port: 8008
