apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: synapse-hookshot
  namespace: matrix
spec:
  parentRefs:
    - name: apps
      namespace: envoy-gateway-system
  hostnames:
    # `lab.`, not the apex — and that is a deliberate exception to the
    # "webhooks come from the internet" instinct.
    #
    # Every hostname in this zone is a CNAME to lab.kalitsune.net, which is
    # the single dynamic A record, so `lab.` names resolve publicly and ARE
    # reachable from outside. The suffix is about intent and the certificate,
    # not about reachability: *.lab.kalitsune.net is already on the apps-tls
    # certificate, so this host needs no cert change, while a new apex name
    # would also have worked but claims a public product surface this is not.
    #
    # Nothing here is a landing page. The only path served is /webhook/<uuid>,
    # and the uuid IS the credential.
    - webhooks.lab.kalitsune.net
  rules:
    # ONE path prefix, on purpose. Hookshot mounts its generic-webhook router
    # at /webhook, and separately serves /live and /ready on the same
    # listener; restricting the route to /webhook keeps the health endpoints
    # (which report internal state) off the public hostname.
    #
    # It also fences off the appservice port entirely: 9993 carries
    # homeserver->bridge transactions authenticated only by the hs_token and
    # is not referenced by any route.
    #
    # The deprecated bare-root handler (hookshot also registers the generic
    # router at "/" for pre-4.x URLs) is likewise unreachable from here —
    # which is the point: it would accept the same hook ids without the path
    # prefix and make a leaked id harder to reason about.
    - matches:
        - path:
            type: PathPrefix
            value: /webhook/
      backendRefs:
        - name: synapse-hookshot
          port: 7775
