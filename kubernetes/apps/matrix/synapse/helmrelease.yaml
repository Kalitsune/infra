apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: synapse
  namespace: matrix
spec:
  interval: 30m
  chart:
    spec:
      chart: matrix-stack
      # Pinned to a patch range, not a major range: ESS versions are CalVer
      # (26.9.x == Sept 2026) and a minor bump can change chart-managed
      # StatefulSet fields. Read the changelog before widening this.
      version: 26.9.x
      sourceRef:
        kind: HelmRepository
        name: ess
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    # The chart runs pre-install/pre-upgrade hook Jobs (init-secrets,
    # deployment-markers, synapse-check-config) before anything rolls; on a
    # cold start those wait on Postgres coming up. Helm's 5m default expires
    # mid-hook and leaves the release stalled with no rollback target.
    remediation:
      retries: 3
  timeout: 20m
  values:
    # Immutable. server_name is baked into every user/room ID; changing it
    # means wiping the database. Bare apex so IDs read @you:kalitsune.net,
    # while the service itself is served from matrix.kalitsune.net.
    serverName: kalitsune.net
    # This cluster has no Ingress controller — it is Gateway API via Envoy
    # Gateway, and routes live in the app's own httproute.yaml. The chart can
    # only emit Ingress objects, so its TLS handling is switched off and the
    # emitted Ingresses are inert: nothing reconciles them. They are left
    # rendered rather than fought with, because `ingress.host` is *required*
    # by the chart's own validation for every enabled component and is also
    # what populates public_baseurl / MAS's http.public_base.
    ingress:
      tlsEnabled: false
    synapse:
      ingress:
        host: matrix.kalitsune.net
      media:
        storage:
          size: 50Gi
          # Media is plain blob storage written once and read many — no
          # fsync/locking semantics to lose, so NFS is correct here and
          # survives the pod moving nodes. The databases below do NOT go here.
          storageClassName: truenas-nfs
      # Hookshot's appservice registration lives in the bridge's own SOPS
      # secret in ../hookshot. Synapse must be told to load it or the bridge
      # cannot authenticate its transactions.
      appservices:
        - secret: hookshot-secrets
          secretKey: registration.yml
    matrixAuthenticationService:
      # MAS is the Matrix 2.0 auth layer (MSC3861). Synapse delegates
      # /login, /logout and /refresh to it entirely — see the login paths in
      # ../synapse/httproute.yaml that point at the MAS Service, not Synapse.
      # It is also what makes OIDC work for Element X, which will not speak
      # Synapse's legacy SSO flow at all.
      ingress:
        host: auth.matrix.kalitsune.net
      additional:
        # Upstream IdP wiring. Held in a SOPS secret because it carries the
        # Pocket ID client secret; the chart merges any `configSecret` into
        # MAS's rendered config at pod start.
        10-upstream-oidc:
          config: |
            upstream_oauth2:
              providers:
                - id: 01J8T3MCCJ625YBV6F7F71RCQJ
                  issuer: "https://id.kalitsune.net"
                  client_id: "7a5bd443-7346-4bd4-8f75-dd0f2705e137"
                  token_endpoint_auth_method: "client_secret_basic"
                  scope: "openid profile email"
                  claims_imports:
                    localpart:
                      action: require
                      template: "{{ user.preferred_username }}"
                    displayname:
                      action: suggest
                      template: "{{ user.name }}"
                    email:
                      action: suggest
                      template: "{{ user.email }}"
        # Local password login is disabled: Pocket ID is the only way in.
        # With exactly one upstream provider and passwords off, MAS skips its
        # own login page and redirects straight to the IdP.
        20-passwords:
          config: |
            passwords:
              enabled: false
            account:
              password_registration_enabled: false
      extraEnv:
        - name: MAS_UPSTREAM_OAUTH2_PROVIDERS_0_CLIENT_SECRET
          value: "7S7E1jypvATvHNz6bzbEtRfsizzSy8NO"
    postgres:
      storage:
        # Postgres manages its own on-disk files and depends on fsync()
        # durability plus byte-range locking that NFS does not reliably give.
        # local-path pins this to the worker node; the trade-off is accepted
        # per AGENT.md. No TrueNAS snapshots — back up with pg_dump.
        storageClassName: local-path
    # Components this repo already runs, or does not want, disabled so the
    # chart does not deploy a second copy.
    matrixRTC:
      # Element Call backend. ../livekit already provides the SFU and the JWT
      # broker on livekit.kalitsune.net. Enabling this would deploy a rival
      # LiveKit and fight over the MatrixRTC well-known.
      enabled: false
    hookshot:
      # ../hookshot is deployed by hand with its own SOPS registration,
      # Redis cryptostore and E2EE config. The chart's copy would collide.
      enabled: false
    elementWeb:
      enabled: false
    elementAdmin:
      enabled: false
    wellKnownDelegation:
      enabled: true
      additional:
        client: |
          {
            "org.matrix.msc2965.authentication": {
              "issuer": "https://auth.matrix.kalitsune.net/",
              "account": "https://auth.matrix.kalitsune.net/account"
            }
          }
