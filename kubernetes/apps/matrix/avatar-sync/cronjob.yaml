apiVersion: batch/v1
kind: CronJob
metadata:
  name: avatar-sync
  namespace: matrix
spec:
  # Hourly. The only thing that changes upstream is a user uploading a new
  # picture in Pocket ID, and the job is a no-op (one DB query, one HTTP GET
  # and one hash compare per linked user) when nothing changed.
  schedule: "17 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          annotations:
            # Bump on every configmap.yaml edit. A CronJob's jobTemplate is
            # mutable (unlike a Job), so this is documentation rather than a
            # forcing function -- but the next run picks up the new script
            # either way, since the ConfigMap is mounted fresh per pod.
            kalitsune.net/config-generation: "1"
        spec:
          restartPolicy: Never
          enableServiceLinks: false
          # The Synapse image, reused purely as a Python 3.13 runtime that
          # already ships requests and psycopg2 -- no custom image to build,
          # host or keep patched for ~150 lines of glue. It is pulled on this
          # node anyway.
          containers:
            - name: sync
              image: oci.element.io/synapse:v1.161.0
              command: [python3, /app/sync.py]
              env:
                - name: SYNAPSE_URL
                  # Straight to the Synapse service, bypassing the gateway,
                  # public DNS and TLS.
                  value: http://synapse-synapse.matrix.svc:8008
                - name: MATRIX_SERVER_NAME
                  value: kalitsune.net
                - name: POCKET_ID_URL
                  value: http://pocket-id.pocket-id.svc.cluster.local
                - name: MAS_DB_HOST
                  value: synapse-postgres.matrix.svc
                - name: MAS_DB_NAME
                  value: matrixauthenticationservice
                - name: MAS_DB_USER
                  value: matrixauthenticationservice_user
                - name: MAS_DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      # Generated by the ESS chart's init-secrets job, not by
                      # this repo. Read-only use: this job never writes to the
                      # MAS database, it only reads the IdP <-> Matrix mapping.
                      name: synapse-generated
                      key: POSTGRES_MATRIX_AUTHENTICATION_SERVICE_PASSWORD
                - name: SYNAPSE_ADMIN_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: avatar-sync
                      key: SYNAPSE_ADMIN_TOKEN
              volumeMounts:
                - name: script
                  mountPath: /app
                  readOnly: true
              resources:
                requests:
                  cpu: 25m
                  memory: 128Mi
                limits:
                  # No CPU limit (it is a short batch job, let it finish), but
                  # a memory limit: it holds whole PNGs in memory and a hostile
                  # or broken upstream response should not evict a bridge.
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
          securityContext:
            # Same uid the Synapse pods run as; this image has no USER and
            # would otherwise run as root.
            runAsNonRoot: true
            runAsUser: 10091
            runAsGroup: 10091
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: script
              configMap:
                name: avatar-sync
