apiVersion: v1
kind: Service
metadata:
  name: continuwuity
  namespace: matrix
spec:
  selector:
    app.kubernetes.io/name: continuwuity
  ports:
    - name: http
      port: 8008
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: continuwuity
  namespace: matrix
spec:
  serviceName: continuwuity
  # Continuwuity has no horizontal scaling and no distributed locking: a
  # second replica would open the same RocksDB directory and corrupt it.
  # A StatefulSet (not a Deployment) is used precisely because its rollout is
  # ordered — the old pod is fully terminated before the new one starts, so
  # unlike a Deployment's default RollingUpdate there is never a moment with
  # two writers on one volume.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: continuwuity
  template:
    metadata:
      annotations:
        # Rolls the pod, which regenerates the first-run bootstrap token.
        #
        # That token is held in memory only (generated by
        # `generate_token_string()` at service build, never written to the
        # database), so restarting the process permanently invalidates the
        # previous one. Bump this integer to rotate it — for example if it
        # was captured somewhere it should not have been, such as a log
        # aggregator or a pasted `kubectl logs` output.
        #
        # generation 2: the token from the initial deploy was read into an
        # agent transcript, which is persisted storage. Rotated.
        kalitsune.net/bootstrap-token-generation: "2"

        # Bump whenever configmap.yaml changes.
        #
        # A ConfigMap consumed through `envFrom` is read once, at container
        # start. Editing it does NOT roll a StatefulSet — Kubernetes sees an
        # unchanged pod template and does nothing, so the new value silently
        # never reaches the process and the app keeps running the old config
        # until something unrelated happens to restart it. Every previous
        # ConfigMap edit here only took effect because it happened to ship
        # alongside a pod-template change.
        #
        # This annotation IS part of the pod template, so bumping it in the
        # same commit as a config edit is what actually applies that edit.
        #
        # generation 3: OIDC delegation to Pocket ID enabled.
        # generation 4: TURN (coturn) + MatrixRTC foci (LiveKit) added. Proof
        #   this annotation matters: the RTC keys were committed without a bump,
        #   Flux updated the ConfigMap, the pod kept its old environment, and
        #   /rtc/transports still returned an empty list — Element continued to
        #   report MISSING_MATRIX_RTC_TRANSPORT against a correct config.
        kalitsune.net/config-generation: "4"
      labels:
        app.kubernetes.io/name: continuwuity
    spec:
      # Kubernetes injects legacy "service link" env vars for every Service in
      # the namespace, named <SERVICE>_<...> — and this Service is called
      # `continuwuity`, so they collide head-on with the CONTINUWUITY_ config
      # prefix. The server parsed seven of them as config keys and logged:
      #
      #   WARN config::check: Config parameter "service_host" is unknown to
      #   conduwuit, ignoring.   (also service_port, service_port_http,
      #   port_8008_tcp, _addr, _port, _proto)
      #
      # Those seven are merely noise because no such config key exists. The
      # real hazard is CONTINUWUITY_PORT, which k8s also injects as
      # `tcp://<clusterIP>:8008` and which IS a valid config key (`port`).
      # Today the ConfigMap overrides it — envFrom wins over service links —
      # so deleting that one ConfigMap entry, an apparently harmless cleanup,
      # would silently feed the server a URL where it expects a port number.
      #
      # Nothing here needs service links: this pod talks to no other Service,
      # and DNS is unaffected. Disabling them removes the whole class of
      # collision rather than papering over the symptom.
      enableServiceLinks: false
      securityContext:
        # The image ships no USER and would otherwise run as root. Nothing
        # here needs it: the only writable path is the data volume, which
        # local-path creates world-writable, and port 8008 is unprivileged.
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: continuwuity
          # v26.8.1, the current stable release.
          # index digest sha256:fdf3cd0ffec66dbbce3c7e58999739355dd0c630b068bb02929a19719448d585
          #
          # ghcr.io is an official mirror of forgejo.ellis.link; an exact
          # version tag makes mirror lag irrelevant. The `-maxperf` variant is
          # deliberately avoided — it is built with aggressive CPU targeting
          # and this cluster runs on an older Xeon.
          image: ghcr.io/continuwuity/continuwuity:v26.8.1
          # The image sets CMD, not ENTRYPOINT, so an unset command here
          # resolves to /sbin/conduwuit. Stated explicitly for readability.
          command:
            - /sbin/conduwuit
          envFrom:
            - configMapRef:
                name: continuwuity-config
            - secretRef:
                name: continuwuity-secrets
            # OIDC client secret for delegated auth against Pocket ID.
            #
            # This must ship in the SAME commit as the
            # CONTINUWUITY_OAUTH__OIDC__DISCOVERY_URL / __CLIENT_ID keys in
            # configmap.yaml. Continuwuity builds its config table from env
            # var NAMES, so this secret alone would create an `oauth.oidc`
            # section holding only a client secret — a partial section, not
            # an absent one, which can fail config parsing at startup.
            - secretRef:
                name: continuwuity-oidc
            # Shared TURN secret (CONTINUWUITY_TURN_SECRET). Paired with the
            # CONTINUWUITY_TURN_URIS / _TTL keys in the ConfigMap: the secret
            # alone would create a turn config that mints credentials for a
            # relay clients are never told about.
            - secretRef:
                name: continuwuity-turn
          ports:
            - name: http
              containerPort: 8008
          # /_matrix/federation/v1/version is unauthenticated and served as
          # soon as the listener is up, which makes it the correct probe
          # target: it proves the Matrix stack answers, not merely that the
          # process is alive.
          startupProbe:
            httpGet:
              path: /_matrix/federation/v1/version
              port: http
            periodSeconds: 5
            # Generous: the very first start creates the RocksDB column
            # families from scratch, and a later start may replay a WAL.
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /_matrix/federation/v1/version
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /_matrix/federation/v1/version
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            # Tolerant on purpose. A busy room join can stall the request
            # thread for a while, and restarting mid-join is strictly worse
            # than waiting it out.
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              # No CPU limit. Federation work is bursty and signature
              # verification during a room join is CPU-bound; throttling it
              # turns a slow join into a failed one. Memory is capped because
              # a runaway RocksDB cache would threaten the whole node.
              memory: 3Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/continuwuity
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        # Deliberately NOT truenas-nfs. Continuwuity stores everything in an
        # embedded RocksDB, which needs POSIX fsync durability and byte-range
        # locking that NFS does not reliably provide — and it uses direct I/O
        # by default, which upstream documents as unsafe on network
        # filesystems. The failure mode is silent corruption, not an error.
        # See the storage section of AGENT.md.
        #
        # Accepted trade-offs: the volume is pinned to one node, and there are
        # no TrueNAS snapshots — back up with Continuwuity's own RocksDB
        # backup engine instead (see README.md).
        storageClassName: local-path
        resources:
          requests:
            # Database plus all uploaded media live on this volume.
            storage: 20Gi
