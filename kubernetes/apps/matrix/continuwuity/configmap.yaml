apiVersion: v1
kind: ConfigMap
metadata:
  name: continuwuity-config
  namespace: matrix
data:
  # Continuwuity takes every config-file option as an environment variable:
  # the TOML key uppercased and prefixed with CONTINUWUITY_, with `__` for
  # nesting (so [global.well_known].server -> CONTINUWUITY_WELL_KNOWN__SERVER).
  # Reference: https://continuwuity.org/configuration.html
  #
  # Only the registration token lives in the Secret; everything here is
  # non-sensitive and is deliberately kept greppable.

  # ---------------------------------------------------------------- identity
  #
  # THE ONE IRREVERSIBLE SETTING. server_name is baked into every event, room
  # and user ID this server ever creates. Changing it requires wiping the
  # database, so it is set deliberately and must not be "tidied" later.
  #
  # The apex is used so user IDs read @you:kalitsune.net rather than
  # @you:matrix.kalitsune.net. That is the whole reason to accept the cost
  # below; it is a permanent, cosmetic-but-public choice.
  #
  # THIS REQUIRES DELEGATION SERVED FROM THE APEX. Other homeservers and
  # clients resolve the *server_name* — kalitsune.net — not the host that
  # actually runs the software. So https://kalitsune.net/ must serve:
  #
  #   /.well-known/matrix/server  -> {"m.server": "matrix.kalitsune.net:443"}
  #   /.well-known/matrix/client  -> {"m.homeserver":
  #                                    {"base_url": "https://matrix.kalitsune.net"}}
  #
  # kalitsune.net resolves to 76.76.21.21 (Vercel), which this cluster does
  # not control, so those two documents are served from the website project,
  # NOT from here. Continuwuity still serves its own copies at
  # matrix.kalitsune.net, but nothing federating ever reads those now —
  # they are resolved from the apex.
  #
  # UNTIL THE APEX SERVES THEM, FEDERATION IS DOWN: remote servers cannot
  # discover where kalitsune.net lives. Local clients pointed explicitly at
  # https://matrix.kalitsune.net keep working throughout.
  CONTINUWUITY_SERVER_NAME: kalitsune.net

  # ------------------------------------------------------------- delegation
  #
  # Matrix federation defaults to port 8448. The `apps` Gateway only listens
  # on 80/443, and adding an 8448 listener would mean touching
  # kubernetes/network/ (the blast-radius directory) plus a new port-forward
  # on the router. Delegation moves federation onto 443, which is already
  # open and already terminated by Envoy.
  #
  # These two values are the CONTENT Continuwuity puts in the well-known
  # documents it serves at matrix.kalitsune.net. Since server_name is now the
  # apex, federating servers resolve kalitsune.net instead and never read
  # these — the authoritative copies are the ones hosted on the apex (Vercel).
  #
  # They are kept, and kept identical to the apex's, for two reasons: a client
  # pointed straight at matrix.kalitsune.net still discovers the right
  # base_url from them, and a mismatch between the two sources is the classic
  # cause of "federation tester passes, clients break" — so if you change the
  # apex documents, change these in the same commit.
  CONTINUWUITY_WELL_KNOWN__SERVER: matrix.kalitsune.net:443
  CONTINUWUITY_WELL_KNOWN__CLIENT: https://matrix.kalitsune.net

  # ----------------------------------------------------------- support info
  #
  # MSC1929 support contact, served at /.well-known/matrix/support. Without
  # it the server logs:
  #
  #   WARN config::check: No support contact information (support_email or
  #   support_mxid) is configured in the well_known
  #
  # and, per the config reference, falls back to listing *every* server admin
  # — so setting an explicit address is the narrower choice, not just the
  # quieter one. This endpoint is public by design: it is how another
  # server's operator reports abuse or a federation problem.
  CONTINUWUITY_WELL_KNOWN__SUPPORT_EMAIL: admin@kalitsune.net
  CONTINUWUITY_WELL_KNOWN__SUPPORT_ROLE: m.role.admin

  # ------------------------------------------------------------- networking
  # 0.0.0.0 is required in a container; 8008 is the image's own EXPOSE.
  # Deliberately NOT the upstream example's port 80, which needs
  # NET_BIND_SERVICE plus a net.ipv4.ip_unprivileged_port_start sysctl for no
  # benefit behind a reverse proxy.
  CONTINUWUITY_ADDRESS: 0.0.0.0
  CONTINUWUITY_PORT: "8008"

  # ---------------------------------------------------------------- storage
  # Mount root, matching the upstream docker-compose. RocksDB keeps the
  # database *and* all uploaded media under here.
  CONTINUWUITY_DATABASE_PATH: /var/lib/continuwuity

  # ----------------------------------------------------------- registration
  #
  # Open registration is refused at startup unless the server was compiled
  # with the "openreg" feature, so the choice is really: closed, or gated by a
  # token. Token-gated is chosen so accounts can be created from a normal
  # Matrix client with no exec into the pod.
  #
  # IMPORTANT — this token does NOT create the first account. Until one
  # non-server local user exists, continuwuity is in "first run mode" and
  # `validate_token` rejects every token except a single-use bootstrap token
  # it generates in memory at startup and prints to stderr. Read it with
  # `kubectl -n matrix logs continuwuity-0`. It is never written to the
  # database, so it changes on every pod restart.
  #
  # CONTINUWUITY_REGISTRATION_TOKEN (from the Secret) only starts working
  # after that first account exists. The first account is automatically made
  # server admin and invited to the admin room.
  CONTINUWUITY_ALLOW_REGISTRATION: "true"

  # ------------------------------------------------------ delegated auth
  #
  # OIDC delegation to Pocket ID (id.kalitsune.net). Accounts come from the
  # IdP instead of local passwords.
  #
  # READ THIS BEFORE ENABLING. Turning these on makes Continuwuity behave as
  # if `oauth.compatibility_mode = "exclusive"`, which:
  #
  #   1. DISABLES LEGACY LOGIN. Any Matrix client that does not implement
  #      next-gen OAuth login (MSC3861) can no longer sign in at all. Element
  #      and Element X do; Cinny, FluffyChat and Nheko generally do not.
  #   2. DISABLES LEGACY REGISTRATION, including the first-run bootstrap
  #      token. So the FIRST ACCOUNT MUST ALREADY EXIST before this lands,
  #      or there is no way to create one and no server admin.
  #
  # `discovery_url` is the IdP base; Continuwuity appends
  # /.well-known/openid-configuration itself. Verified present:
  #   curl https://id.kalitsune.net/.well-known/openid-configuration
  #   -> issuer https://id.kalitsune.net, S256 PKCE, scopes incl. openid
  #
  # The matching redirect URI to register in Pocket ID is
  #   https://matrix.kalitsune.net/_continuwuity/oidc/complete
  # which is served from the client-facing host, not the server_name.
  #
  # The client secret is NOT here — it lives in oidc-secret.yaml (SOPS).
  #
  # CONTINUWUITY_OAUTH__OIDC__DISCOVERY_URL: https://id.kalitsune.net
  # CONTINUWUITY_OAUTH__OIDC__CLIENT_ID: continuwuity
  #
  # Keep prompt_for_localpart at its default (true) for the first login so
  # the existing local account can be linked by entering its user ID; only
  # set it false, with preferred_username_claim, once linking is done.
  # CONTINUWUITY_OAUTH__OIDC__PROMPT_FOR_LOCALPART: "true"

  # ---------------------------------------------------------------- privacy
  # Do not advertise this server's room directory to the wider federation,
  # and keep the built-in web pages out of search engines. Both are the
  # upstream defaults; they are pinned here because they are security
  # relevant and a default flip should not silently change behaviour.
  CONTINUWUITY_ALLOW_PUBLIC_ROOM_DIRECTORY_OVER_FEDERATION: "false"
  CONTINUWUITY_ALLOW_WEB_INDEXING: "false"

  # ------------------------------------------------------------- federation
  CONTINUWUITY_ALLOW_FEDERATION: "true"
  CONTINUWUITY_ALLOW_ENCRYPTION: "true"
  # Notary servers used to fetch other homeservers' signing keys. matrix.org
  # is the conventional choice and makes the first join to a large room
  # dramatically faster, because keys come from one batch query instead of
  # hundreds of individual origin servers.
  CONTINUWUITY_TRUSTED_SERVERS: '["matrix.org"]'

  # -------------------------------------------------------------- behaviour
  # Upstream appends the trans pride flag to every new display name by
  # default. Disabled here: a private homeserver should not decorate its
  # users' names without being asked. Purely cosmetic and safe to revert.
  CONTINUWUITY_NEW_USER_DISPLAYNAME_SUFFIX: ""

  # 50 MB uploads (default is 20 MB). Envoy streams request bodies rather
  # than buffering them, so no matching gateway setting is needed.
  CONTINUWUITY_MAX_REQUEST_SIZE: "50000000"

  # ------------------------------------------------------------- footprint
  #
  # Left to itself Continuwuity sizes its caches from the *node's* core count
  # (8 here), not the container's share, which would blow past the memory
  # limit on a box shared with everything else in this cluster. These pin it
  # to a modest, predictable working set.
  TOKIO_WORKER_THREADS: "2"
  CONTINUWUITY_ROCKSDB_PARALLELISM_THREADS: "2"
  CONTINUWUITY_DB_CACHE_CAPACITY_MB: "256.0"
  CONTINUWUITY_DB_WRITE_BUFFER_CAPACITY_MB: "48.0"
  CONTINUWUITY_CACHE_CAPACITY_MODIFIER: "0.5"

  CONTINUWUITY_LOG: info
  # No TTY on stdout; ANSI escapes would just be noise in `kubectl logs`.
  CONTINUWUITY_LOG_COLORS: "false"
