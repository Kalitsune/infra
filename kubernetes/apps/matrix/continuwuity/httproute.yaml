apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: continuwuity
  namespace: matrix
spec:
  parentRefs:
    - name: apps
      namespace: envoy-gateway-system
  hostnames:
    # Public, on the apex domain rather than `lab.` — and that is the whole
    # point rather than an oversight. A Matrix homeserver that cannot be
    # reached by other homeservers cannot federate, which is the entire
    # reason to run one. The surface is deliberately small:
    #
    #   - registration is gated by a token (SOPS-encrypted, not in git)
    #   - the room directory is not federated
    #   - the built-in web pages are marked noindex
    #
    # This hostname is dedicated to the homeserver, so there is nothing else
    # behind it that public exposure could reach.
    - matrix.kalitsune.net
  rules:
    # One catch-all rule. Continuwuity needs /_matrix/, /_continuwuity/,
    # /.well-known/matrix/* and / (its landing page) all served from the same
    # origin, and this host serves nothing else, so path-splitting them would
    # add failure modes without removing any surface.
    #
    # Timeouts are raised because Matrix /sync is a LONG-POLL protocol: a
    # client asks the server to hold the request open (typically 30s) until
    # an event arrives. Envoy's default route timeout is 15s, so every idle
    # sync was cut off mid-poll and the client saw
    #
    #   504 upstream request timeout
    #
    # ("upstream request timeout" is Envoy's own body, not Continuwuity's —
    # the homeserver was healthy throughout.) The bot reconnected in a loop
    # and never received anything, so it looked connected but was deaf.
    #
    # 180s covers the 30s sync poll with wide margin, and also the slow
    # federation calls (signature verification when joining a large room)
    # that would otherwise trip the same limit. request must be >=
    # backendRequest; both are set so no layer silently keeps 15s.
    - timeouts:
        backendRequest: 180s
        request: 180s
      backendRefs:
        - name: continuwuity
          port: 8008
