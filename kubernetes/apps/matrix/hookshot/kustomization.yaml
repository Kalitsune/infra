apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - configmap.yaml
  # Holds registration.yml (the appservice tokens) and passkey.pem. The
  # homeserver keeps its own copy of the tokens — registered by hand in the
  # #admins room, see README.md — so rotating this Secret is a two-sided
  # operation, not a git-only one.
  - secret.yaml
  - pvc.yaml
  - redis.yaml
  - deployment.yaml
  - httproute.yaml

# The matrix namespace is created by the continuwuity app, which this depends
# on anyway: an appservice is meaningless without the homeserver that pushes
# transactions to it. Deliberately not re-declared here.
