apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mautrix-linkedin
  namespace: matrix
spec:
  accessModes: [ReadWriteOnce]
  # SQLite and the olm crypto store need real POSIX locking and honest fsync,
  # which the NFS class does not provide. See the storage notes in AGENT.md.
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mautrix-linkedin
  namespace: matrix
spec:
  selector:
    app.kubernetes.io/name: mautrix-linkedin
  ports:
    - name: appservice
      port: 29341
      targetPort: appservice
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mautrix-linkedin
  namespace: matrix
spec:
  replicas: 1
  # SQLite is single-writer; a RollingUpdate would briefly run two pods against
  # one database file on every image bump.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mautrix-linkedin
  template:
    metadata:
      annotations:
        # Mounted Secrets do not roll a Deployment on their own and this
        # cluster has no Reloader, so the config hash rides in the pod
        # spec: change the config, change this, get a new pod.
        checksum/config: c33ff5b4d24b1abe
      labels:
        app.kubernetes.io/name: mautrix-linkedin
    spec:
      securityContext:
        fsGroup: 1337
      containers:
        - name: bridge
          image: dock.mau.dev/mautrix/linkedin:v26.09
          # -n (--no-update) stops the bridge rewriting its own config on
          # startup: the file is a read-only Secret mount and the write is fatal.
          command: [/usr/bin/mautrix-linkedin, -c, /config/config.yaml, -n]
          ports:
            - name: appservice
              containerPort: 29341
          volumeMounts:
            - name: config
              mountPath: /config/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: config
          secret:
            secretName: mautrix-linkedin
        - name: data
          persistentVolumeClaim:
            claimName: mautrix-linkedin
