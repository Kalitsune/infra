apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mautrix-signal
  namespace: matrix
spec:
  accessModes: [ReadWriteOnce]
  # SQLite and the olm crypto store need real POSIX locking and honest fsync,
  # which the NFS class does not provide. See the storage notes in AGENT.md.
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mautrix-signal
  namespace: matrix
spec:
  selector:
    app.kubernetes.io/name: mautrix-signal
  ports:
    - name: appservice
      port: 29328
      targetPort: appservice
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mautrix-signal
  namespace: matrix
spec:
  replicas: 1
  # SQLite is single-writer; a RollingUpdate would briefly run two pods against
  # one database file on every image bump.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mautrix-signal
  template:
    metadata:
      annotations:
        # config.yaml rolls the pod by itself: it comes from a configMapGenerator,
        # so editing it renames the ConfigMap and changes this pod spec. The
        # Secret half has no such hash and mounted Secrets never roll a
        # Deployment, so rotating a token in secret.yaml means bumping this
        # counter in the same commit.
        checksum/secrets: "1"
      labels:
        app.kubernetes.io/name: mautrix-signal
    spec:
      securityContext:
        fsGroup: 1337
      containers:
        - name: bridge
          image: dock.mau.dev/mautrix/signal:v26.09
          # The bridge takes exactly one -c (a second one replaces the first
          # rather than merging), so the two halves are merged here instead:
          # yq deep-merges the Secret over the ConfigMap into a tmpfs copy that
          # only this container can read. yq ships in the bridge image already.
          command:
            - sh
            - -c
            - >-
              umask 077 &&
              yq '. *= load("/secrets/secrets.yaml")' /config/config.yaml
              > /run/bridge/config.yaml &&
              exec /usr/bin/mautrix-signal -c /run/bridge/config.yaml -n
          ports:
            - name: appservice
              containerPort: 29328
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: secrets
              mountPath: /secrets
              readOnly: true
            - name: run
              mountPath: /run/bridge
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: mautrix-signal-config
        - name: secrets
          secret:
            secretName: mautrix-signal
        # Holds the merged config only. Memory-backed so the assembled file,
        # which does contain the tokens, never touches a disk.
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: data
          persistentVolumeClaim:
            claimName: mautrix-signal
