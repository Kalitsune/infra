# lk-jwt-service: the broker between Matrix identity and LiveKit.
#
# Element Call asks this service for a token. It verifies the caller's Matrix
# OpenID token against the homeserver, then signs a LiveKit JWT with the
# shared API key/secret. LiveKit itself never talks to Matrix.
#
# Ordinary ClusterIP + Deployment: this half is plain HTTP with no media, so
# it needs none of LiveKit's host networking.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lk-jwt-service
  namespace: matrix
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lk-jwt-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lk-jwt-service
      annotations:
        kalitsune.net/config-generation: "1"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: lk-jwt-service
          image: ghcr.io/element-hq/lk-jwt-service:0.2.3
          env:
            # This image reads LIVEKIT_JWT_PORT, not LIVEKIT_JWT_BIND — its
            # own startup log prints "LIVEKIT_JWT_PORT: 8080". Setting BIND
            # was silently ignored, so it listened on 8080 while the Service
            # and probe targeted 8081 and readiness never passed.
            - name: LIVEKIT_JWT_PORT
              value: "8080"
            # The URL clients are told to connect to — public and wss://,
            # not the in-cluster Service. This value is handed to the client
            # inside the JWT response, so it must be routable from a browser.
            - name: LIVEKIT_URL
              value: "wss://livekit.kalitsune.net"
            # Users of this homeserver get full access (create/join). Other
            # homeservers' users can still join a room they are invited to,
            # but cannot create. server_name, not the delegated host.
            - name: LIVEKIT_FULL_ACCESS_HOMESERVERS
              value: "kalitsune.net"
          envFrom:
            # LIVEKIT_KEY + LIVEKIT_SECRET. Must be the same pair livekit
            # itself loads, or every minted JWT is rejected as unsigned.
            - secretRef:
                name: livekit-keys
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: lk-jwt-service
  namespace: matrix
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: lk-jwt-service
  ports:
    - name: http
      port: 8081
      targetPort: 8080
