apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: apps-tls
  namespace: envoy-gateway-system
spec:
  secretName: apps-tls
  dnsNames:
    # A wildcard matches exactly one label, so "*.kalitsune.net" does NOT
    # cover "radarr.lab.kalitsune.net". Each subdomain level in use needs
    # its own wildcard entry or TLS fails with curl exit 60 (cert verify).
    - "*.kalitsune.net"
    # radarr/sonarr/prowlarr/bazarr/torrent .lab.kalitsune.net
    - "*.lab.kalitsune.net"
    - "*.hermes.kalitsune.net"
    # requests.watch.kalitsune.net (jellyseerr)
    - "*.watch.kalitsune.net"
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
