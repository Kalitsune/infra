---
# Proxmox VE (topaz) — self-signed HTTPS at 192.168.1.161:8006
# TrueNAS SCALE   — self-signed HTTPS at 192.168.1.162:443
#
# Both UIs run HTTPS with self-signed certs and sit outside the cluster.
# The Envoy Gateway can't natively reach them as backends without the Backend
# CRD (disabled) and a CA bundle (unavailable). oauth2-proxy bridges both
# problems: it terminates OIDC, validates the group claim, then reverse-proxies
# to the upstream over HTTPS with TLS verification disabled (self-signed).
#
# Group restriction: only members of "metal-admin-topaz" can pass the OIDC gate.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy-proxmox
  namespace: metal
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: oauth2-proxy-proxmox
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oauth2-proxy-proxmox
    spec:
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.8.1
          args:
            - --provider=oidc
            - --oidc-issuer-url=https://id.kalitsune.net
            - --redirect-url=https://proxmox.lab.kalitsune.net/oauth2/callback
            - --upstream=https://192.168.1.161:8006
            - --ssl-upstream-insecure-skip-verify=true
            - --http-address=0.0.0.0:4180
            - --email-domain=*
            - --cookie-secure=true
            - --cookie-name=_oauth2_proxy_proxmox
            - --session-store-type=cookie
            - --banner=-
            - --skip-provider-button=true
            - --code-challenge-method=S256
            - --scope=openid email profile groups
            - --oidc-groups-claim=groups
            - --allowed-group=metal-admin-topaz
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: metal-oauth2-secret
                  key: clientId
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: metal-oauth2-secret
                  key: clientSecret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: metal-oauth2-secret
                  key: cookieSecret
          ports:
            - name: http
              containerPort: 4180
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy-proxmox
  namespace: metal
spec:
  selector:
    app.kubernetes.io/name: oauth2-proxy-proxmox
  ports:
    - port: 4180
      targetPort: http
---
