apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: continuwuity
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/apps/matrix/continuwuity
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    # The RocksDB volume uses local-path, not the NFS class, so this depends
    # on the local-path provisioner rather than democratic-csi-nfs.
    - name: local-path-provisioner
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  wait: true
  # Longer than the 5m most apps use: the first reconcile pulls a ~50 MB
  # image and then creates the RocksDB column families from an empty volume
  # before the federation endpoint answers its startup probe.
  timeout: 10m
