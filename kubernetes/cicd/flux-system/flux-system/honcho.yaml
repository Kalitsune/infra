apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: honcho
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/apps/honcho/honcho
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    # Postgres uses local-path, not the NFS class, so this does not depend on
    # democratic-csi-nfs the way hermes does.
    - name: local-path-provisioner
    # Honcho's LLM backend is 9Router, and the API key it authenticates with
    # is minted by 9router's provisioning Job into honcho/9router-honcho-key.
    # envFrom is read once at container start, so a Honcho pod that starts
    # before that Job has run comes up with no key and fails every LLM call
    # until something restarts it. 9router's Kustomization sets wait: true,
    # which includes Job completion, so depending on it orders the two
    # correctly. Not circular: 9router depends on nothing.
    - name: 9router
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  wait: true
  # Longer than the 5m the other apps use: the first reconcile pulls the
  # Postgres and Honcho images and then runs the full alembic migration chain
  # against an empty database before the API reports ready.
  timeout: 10m
