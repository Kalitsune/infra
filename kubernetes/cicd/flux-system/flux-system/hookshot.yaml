apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hookshot
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/apps/matrix/hookshot
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    # Creates the matrix namespace, and is the homeserver this appservice
    # bridges to. Hookshot's startup probe cannot pass until continuwuity
    # answers getWhoAmI(), so ordering here avoids a pointless crash window.
    - name: continuwuity
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  wait: true
  timeout: 5m
