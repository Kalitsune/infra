apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: synapse
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/apps/matrix/synapse
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: local-path-provisioner
    - name: democratic-csi-nfs
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  wait: true
  timeout: 10m
