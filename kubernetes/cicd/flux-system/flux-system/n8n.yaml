apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: n8n
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/apps/n8n/n8n
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # secret-oidc.yaml is SOPS-encrypted. Without this block Flux applies the
  # ciphertext verbatim: the Secret's value becomes the literal string
  # "ENC[AES256_GCM,...]" and Pocket ID answers "client does not exist".
  # (n8n still generates its own credentials encryption key on the volume.)
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  wait: true
  timeout: 5m
