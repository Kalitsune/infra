apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: n8n
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/apps/n8n/n8n
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # No `decryption` block: this app ships no SOPS secret. n8n generates and
  # persists its own credentials encryption key on the data volume.
  wait: true
  timeout: 5m
