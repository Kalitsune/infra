apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: finnegan
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/apps/hermes/finnegan
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # The namespace, the shared hermes-secrets Secret and the oauth2-proxy-secret
  # this release reads are all owned by the `hermes` Kustomization. Ordering
  # here avoids a first-run failure on a missing namespace or Secret.
  dependsOn:
    - name: hermes
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  wait: true
  timeout: 10m
