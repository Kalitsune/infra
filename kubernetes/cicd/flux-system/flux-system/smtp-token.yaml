apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: smtp-token-pocket-id
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/shared/smtp-token
  prune: true
  targetNamespace: pocket-id
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: pocket-id
  wait: true
  timeout: 5m
