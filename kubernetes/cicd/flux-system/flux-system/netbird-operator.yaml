apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: netbird-operator
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/apps/netbird/operator
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    # netbird: the namespace and the control plane the operator authenticates
    # against. cert-manager: the API server reaches the operator's admission
    # webhook over a cert-manager-issued certificate.
    - name: netbird
    - name: cert-manager
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  wait: true
  timeout: 10m
