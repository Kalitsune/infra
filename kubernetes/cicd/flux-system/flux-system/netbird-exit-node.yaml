apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: netbird-exit-node
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/apps/netbird/exit-node
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: netbird
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  wait: true
  timeout: 5m
