apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: draupnir
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/apps/matrix/draupnir
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    # Creates the matrix namespace, and is the homeserver Draupnir moderates.
    # Draupnir's startup calls /account/whoami and then resolves the
    # management room; both fail hard (process exit, not safe mode) if the
    # homeserver is not answering, so ordering here avoids a crash window.
    - name: continuwuity
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  wait: true
  timeout: 5m
