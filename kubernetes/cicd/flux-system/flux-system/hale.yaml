apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hale
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/apps/agents/hale
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # The namespace and the shared honcho-client-secrets / hermes-managed
  # objects are owned by the `hermes` Kustomization, and the migration init
  # container mounts that release's PVC. Ordering here avoids a first-run
  # failure on a missing namespace or an unbound claim.
  dependsOn:
    - name: umami
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  wait: true
  timeout: 10m
