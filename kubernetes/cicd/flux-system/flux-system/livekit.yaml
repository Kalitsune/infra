apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: livekit
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/apps/matrix/livekit
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    # Provides the matrix namespace (with the privileged pod-security label
    # LiveKit needs) and the homeserver that advertises this SFU to clients.
    - name: continuwuity
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  wait: true
  timeout: 5m
